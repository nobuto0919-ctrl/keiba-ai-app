:root{--ink:#0f1b2d;--ink2:#1b2a41;--gold:#c9a24b;--gold2:#e8cf8f;--paper:#f6f3ec;--line:#e7e1d4;--muted:#7a7f8a}
body{background:var(--paper)}
.num{font-family:'Inter','Noto Sans JP',sans-serif;font-feature-settings:"tnum"}
.appbar{background:linear-gradient(160deg,var(--ink),var(--ink2))}
.tc{font-family:'Inter',sans-serif;font-weight:800;font-size:11px;min-width:20px;height:20px;padding:0 4px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#fff}
.tc-S{background:linear-gradient(135deg,#e8cf8f,#b48a2f);color:#2b1f05}.tc-A{background:#2f8f6b}.tc-B{background:#3a7bd5}.tc-C{background:#a3a7b0}
.hero{border-radius:18px;padding:14px;background:linear-gradient(160deg,var(--ink),var(--ink2));color:#fff;border:1px solid rgba(232,207,143,.35)}

.stc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.bnav{display:none}
.mcell{display:none}
.mtbl{display:none}
.pn{cursor:pointer}.pn .pt{font-size:9px;color:#9a7b2f;font-weight:600;margin-left:3px}

  .mcell .tc{min-width:17px;height:17px;font-size:9px;border-radius:5px;padding:0 3px}
  .mcell.ms{background:#fffaf0;border-color:#e8cf8f}

  .mcell .c small.rs{color:#6b6f76;font-weight:600}
  .mcell .c small.rs.hit{color:#d64545;font-weight:800}
  .mtbl{display:table;width:100%;border-collapse:collapse;background:#fff;font-size:12px;border:1px solid var(--line)}
  .mtbl th{background:var(--ink);color:var(--gold2);font-size:10px;padding:6px 3px;font-weight:700}
  .mtbl td{padding:5px 3px;border-bottom:1px solid #f0ebe0;text-align:center;white-space:nowrap}
  .mtbl td.nm{text-align:left;font-weight:700}
  .mtbl td.nm small{display:block;font-weight:400;color:var(--muted);font-size:10px}
  .mtbl tr.ax td{background:#fff8e6}
  .mtbl tr.pastrow td{white-space:normal;text-align:left;padding:0;background:#faf8f3}
  .mtbl .wk{display:inline-flex;width:20px;height:20px;border-radius:5px;align-items:center;justify-content:center;font-weight:800;font-size:11px}
  .dtable{display:none}
}

  return {n: rows.length, done: done.length, hits: done.filter(x => x[8] > 0).length, cost, ret, roi: cost ? Math.round(ret / cost * 100) : null, worst};
};

// 過去の重賞の結果タブ（2026-11-21 利用者の希望: いつものレースの結果と同じ中身）。resultTab に渡せる形に組み直す
// det.hr = {馬番: [タイム, 着差, 通過, 上がり3F, 馬体重, PCI, 確定人気, 確定単勝]}、det.rc = レースの流れ・ラップ・通過順・払戻（share_export）
const wakuOf = (n, heads) => {   // JRA の枠の決め方: 8頭までは馬番＝枠、それより多いと外の枠から2頭（3頭）になる
  if (heads <= 8) return n;
  const base = Math.floor(heads / 8), rem = heads % 8;
  let c = 0;
  for (let w = 1; w <= 8; w++) { c += base + (w > 8 - rem ? 1 : 0); if (n <= c) return w; }
  return 8;
};
function histResult(x, det) {
  if (!det.rc && !Object.keys(det.hr || {}).length) return `<div class="sec-h">着順</div><p class="text-gray-500">結果の詳しいデータがありません。</p>`;
  const heads = det.h.length;
  const horses = det.h.map(h => {
    const v = (det.hr || {})[h[0]] || [];
    return {num: h[0], name: h[1], jockey: h[2], odds: h[3], pop: h[4], fin: h[5], grade: h[6], mark: h[7], waku: wakuOf(h[0], heads),
            time: v[0], margin: v[1], pos: v[2], l3f: v[3], weight: v[4], hpci: v[5], rpop: v[6], odds_final: v[7]};
  });
  return resultTab({horses, surface: x.s === "芝" ? "芝" : "ダート", result: {race: det.rc || {}}, ev: det.ev});
}

  const inP = x => !p || p === "all" ? true : p[0] === "y" ? x[0].startsWith(p.slice(1)) : x[0] >= since(+p.slice(1));
  const rows = all.filter(x => inP(x) && (STATS_F.tier === "" || (STATS_F.tier === "SA" ? ["S", "A"].includes(x[5]) : x[5] === STATS_F.tier)) &&
    (!STATS_F.cls || x[3] === STATS_F.cls) && (!STATS_F.surf || x[4] === STATS_F.surf) && (!STATS_F.kind || x[6] === STATS_F.kind));
  const s = sumRows(rows);
  const filters = `<div class="fbox">` +
    sel("tier", [["", "すべて"], ["SA", "S・A"], ["S", "S"], ["A", "A"], ["B", "B"], ["C", "C"]]) +
    sel("cls", [["", "すべて"], ...CLS_ORDER.map(c => [c, clsName(c)])]) +
    sel("surf", [["", "すべて"], ["芝", "芝"], ["ダ", "ダート"]]) +
    sel("kind", [["", "すべて"], ...kinds.map(k => [k, k])]) +
    sel("period", [...years.map(y => ["y" + y, y + "年"]), ["d90", "直近3か月"], ["d30", "直近1か月"], ["all", "全期間"]]) + `</div>`;
  const kpi = (lab, val, sub = "") => `<div class="stc"><div class="text-[11px] text-gray-500">${lab}</div><div class="num text-base font-extrabold">${val}</div>${sub ? `<div class="text-[10px] text-gray-400">${sub}</div>` : ""}</div>`;
  const pl = s.ret - s.cost;
  const big = `<div class="hero mb-3"><div class="text-[11px] tracking-widest text-gray-300">回収率</div><div class="num text-4xl font-black mt-1" style="color:${s.roi >= 100 ? "var(--gold2)" : "#fff"}">${s.roi == null ? "-" : s.roi}<span class="text-lg">%</span></div>` +
    `<div class="text-[12px] text-gray-300 mt-1">${s.done}レース・的中${s.hits}回（${s.done ? Math.round(s.hits / s.done * 100) : 0}%）・収支 <span class="num">${pl >= 0 ? "+" : ""}${yen(pl)}</span>円</div></div>`;
  const kpis = `<div class="grid grid-cols-3 gap-2 mb-3">${kpi("投資", yen(s.cost) + "円")}${kpi("払戻", yen(s.ret) + "円")}${kpi("最大連敗", s.worst + "回", s.n > s.done ? `結果待ち ${s.n - s.done}R` : "")}</div>`;
  const byTier = ["S", "A", "B", "C"].map(t => [t, sumRows(rows.filter(x => x[5] === t))]).filter(([, x]) => x.n);
  const bt = byTier.length > 1 ? `<div class="sec-h">推奨度ごと</div><div class="grid grid-cols-2 gap-2">${byTier.map(([t, x]) => `<div class="stc flex items-center gap-2"><span class="tc tc-${t}">${t}</span><span class="text-[11px] text-gray-500">${x.done}R・的中${x.hits}</span><span class="ml-auto num font-extrabold ${roiCls(x.roi)}">${x.roi == null ? "-" : x.roi + "%"}</span></div>`).join("")}</div>` : "";
  const months = [...new Set(rows.map(x => x[0].slice(0, 6)))].sort().reverse();
  const mt = months.length ? `<div class="sec-h">月ごと</div><div class="lst"><table class="w-full text-[12px]"><tr class="text-[11px] text-gray-500"><th class="py-2 pl-3 text-left font-normal">月</th><th class="font-normal">レース</th><th class="font-normal">的中</th><th class="font-normal">収支</th><th class="pr-3 text-right font-normal">回収率</th></tr>` +
    months.map(m => { const x = sumRows(rows.filter(r => r[0].startsWith(m))), q = x.ret - x.cost; return `<tr class="border-t border-[#f0ebe0]"><td class="py-2 pl-3">${m.slice(0, 4)}/${+m.slice(4)}</td><td class="text-center num">${x.done}</td><td class="text-center num">${x.hits}</td>` +
      `<td class="text-center num ${q >= 0 ? "text-emerald-700" : "text-gray-500"}">${q >= 0 ? "+" : ""}${yen(q)}</td><td class="pr-3 text-right num font-bold ${roiCls(x.roi)}">${x.roi == null ? "-" : x.roi + "%"}</td></tr>`; }).join("") + `</table></div>` : `<div class="stc text-gray-500">この条件のレースはありません</div>`;
  return `<div class="max-w-3xl"><h1 class="text-lg font-bold mb-3">成績</h1>${filters}${big}${kpis}${bt}${mt}` +
    `<div class="text-[11px] text-gray-500 mt-3">1レース1,500円。過去の日付は今の決め方で付け直した買い目（発走10分前のオッズ）で数えています。</div>${await gradedSection()}</div>`;
}

async function home() {
  const days = await get("days");
  const cur = currentDate(days.map(x => x.date));
  const d = cur ? await get(cur) : {races: []};
  const today = todayStr(), isToday = cur === today;
  const places = [...new Set(d.races.map(r => r.place))];
  const cnt = t => d.races.filter(r => r.bet_v && vn(r.bet_v.tier) === t).length;
  const doneSA = d.races.filter(r => r.bet_v && ["新S", "新A"].includes(r.bet_v.tier) && (r.result || {}).v);
  const dayPL = doneSA.reduce((a, r) => a + r.result.v.ret - r.result.v.cost, 0);
  const rows = await get("bets"), y = today.slice(0, 4);

  const wd = cur ? WEEK[new Date(+cur.slice(0, 4), +cur.slice(4, 6) - 1, +cur.slice(6)).getDay()] : "";
  const head = `<div class="mb-3"><div class="text-[11px] tracking-[.2em] text-[#9a7b2f] font-bold">${isToday ? "TODAY" : cur > today ? "NEXT RACE DAY" : "LAST RACE DAY"}</div>` +
    `<div class="text-2xl font-black text-[#0f1b2d] mt-0.5">${cur ? `${+cur.slice(4, 6)}月${+cur.slice(6)}日<span class="text-base font-bold ml-1">（${wd}）</span>` : "開催なし"}</div>` +
    `<div class="text-[12px] text-gray-500">${places.map(e).join("・")} ${d.races.length}レース</div></div>`;
  const chips = `<a href="#d-${cur}" class="chips mb-3">${["S", "A", "B", "C"].map(t => `<div><span class="tc tc-${t}">${t}</span><span class="num font-extrabold text-lg ml-1">${cnt(t)}</span><small>R</small></div>`).join("")}` +
    `<div class="ml-auto text-[11px] text-[#9a7b2f] font-bold">レース一覧 ›</div></a>` +
    (doneSA.length ? `<div class="text-[12px] text-gray-600 -mt-1 mb-3 pl-1">この日の推奨度S・A：${doneSA.length}レース終了・収支 <span class="num font-bold ${dayPL >= 0 ? "text-emerald-700" : ""}">${dayPL >= 0 ? "+" : ""}${yen(dayPL)}円</span></div>` : "");
  const card = (lab, t, x) => `<a href="#stats" data-sf="${sfAttr({tier: t, cls: "", surf: "", kind: "", period: "y" + y})}" class="stc block"><div class="text-[11px] text-gray-500 flex items-center gap-1 h-5">${lab}</div>` +
    `<div class="num text-2xl font-extrabold ${roiCls(x.roi)}">${x.roi ?? "-"}<span class="text-sm">%</span></div><div class="text-[10px] text-gray-400">${x.done}R・的中${x.hits}回</div></a>`;
  const kpis = `<div class="sec-h">${y}年の回収率</div><div class="grid grid-cols-3 gap-2">${card('<span class="tc tc-S">S</span>', "S", sy(["S"]))}${card('<span class="tc tc-A">A</span>', "A", sy(["A"]))}${card("全推奨度", "", sy(["S", "A", "B", "C"]))}</div>`;
  const menu = `<div class="sec-h">メニュー</div><div class="grid grid-cols-2 gap-2">` +
    [[`#d-${cur}`, "レース一覧", places.join("・") || "-"], ["#tiers", "推奨度の一覧", "クラス×芝ダートの推奨度"], ["#stats", "成績を調べる", "条件で絞って回収率"], ["#days", "開催日の一覧", "これまでの開催と成績"]]
      .map(([h, t, s]) => `<a href="${h}" class="stc block"><div class="font-bold text-[13px] text-[#0f1b2d]">${t} <span class="text-[#c9a24b]">›</span></div><div class="text-[11px] text-gray-500 mt-0.5">${e(s)}</div></a>`).join("") + `</div>`;
  document.title = "AI競馬予想";
  return `<div class="max-w-3xl">${head}${chips}${await nextPicks(days)}${kpis}${menu}` +

const NAV_BTN = "px-3 py-1.5 bg-white border border-gray-300 rounded text-xs font-bold text-[#2c3e50]";
// 開催日の移動（1日前の開催／日付選択／1日後の開催）
async function dayNav(date) {
  const ds = (await get("days")).map(x => x.date).sort();
  const i = ds.indexOf(date), md = x => `${+x.slice(4, 6)}/${+x.slice(6)}`;
  const btn = (x, label) => x ? `<a href="#d-${x}" class="${NAV_BTN} hover:bg-yellow-50 whitespace-nowrap">${label}</a>` : `<span class="${NAV_BTN} opacity-40 whitespace-nowrap">${label}</span>`;
  const prev = ds[i - 1], next = ds[i + 1];
  return `<div class="flex flex-wrap items-center gap-2 mb-3">${btn(prev, `◀ 1日前の開催${prev ? `（${md(prev)}）` : ""}`)}` +
    `<select data-nav aria-label="開催日を選ぶ" class="${NAV_BTN}">${[...ds].reverse().map(x => `<option value="d-${x}"${x === date ? " selected" : ""}>${jpDate(x)}</option>`).join("")}</select>` +
    `${btn(next, `1日後の開催${next ? `（${md(next)}）` : ""} ▶`)}</div>`;
}
// 出馬表の上のレース移動（同じ日の全開催を場ごとに1R〜12Rのボタンで）。結果タブを見ているときは移動先も結果タブ
function raceNav(date, d, cur, tab) {
  const rows = [...new Set(d.races.map(x => x.place))].map(pl => {
    const btns = d.races.filter(x => x.place === pl).sort((a, b) => a.race - b.race).map(x => {
      const on = x === cur;
      return `<a href="#${raceId(date, x)}${tab === "res" && x.result ? "-res" : ""}"${on ? ' aria-current="page"' : ""} class="block text-center py-1 rounded text-xs font-bold border ${on ? "bg-[#2c3e50] text-white border-[#2c3e50]" : "bg-white text-[#2c3e50] border-gray-300 hover:bg-yellow-50"}">${x.race}</a>`;
    }).join("");
    return `<div class="flex items-center gap-2"><span class="w-9 shrink-0 text-xs font-bold ${pl === cur.place ? "text-[#2c3e50]" : "text-gray-500"}">${e(pl)}</span><div class="grid grid-cols-12 gap-0.5 md:gap-1 flex-1 max-w-[520px]">${btns}</div></div>`;
  }).join("");
  return `<div class="grid gap-1 mb-4">${rows}</div>`;
}

async function dayPage(date) {
  const d = await get(date);
  const vDay = t => vStats(d, t).bets ? `<div class="${VT[t].text}">${statsText(vStats(d, t), "推奨度" + vn(t))}</div>` +
    (vStats(d, t, "v_alt").bets ? `<div class="${VT[t].text}">${statsText(vStats(d, t, "v_alt"), "推奨度" + vn(t) + "（3連複）")}</div>` : "") : "";
  const places = [...new Set(d.races.map(r => r.place))];
  const cols = places.map(pl => {
    const rs = d.races.filter(r => r.place === pl).sort((a, b) => a.race - b.race);
    const r0 = rs.find(r => r.kai) || rs[0];
    const head = r0.kai ? `${r0.kai}回 <span class="text-base mx-0.5">${e(pl)}</span> ${r0.nichi}日目` : `<span class="text-base">${e(pl)}</span>`;
    const turf = (rs.find(r => r.surface === "芝" && r.track) || {}).track || "-";
    const dirt = (rs.find(r => r.surface === "ダート" && r.track) || {}).track || "-";
    const cards = rs.map(r => {
      let rec = pending(r) ? '<span class="text-[10px] text-gray-500 bg-gray-100 border border-gray-200 px-1 rounded"><span class="md:hidden">準備中</span><span class="hidden md:inline">対応をお待ちください</span></span>' :
                (r.bet ? `<span class="${TIER[tierOf(r)].badge}">${TIER[tierOf(r)].name}</span> ` : "") +
                (r.bets_a ? `<span class="badge-tiera">推奨度A</span> ` : "") +
                (r.bet_v ? `<span class="${VT[vTierOf(r)].badge}">推奨度${vn(vTierOf(r))}</span>` : "") +
                (noBet(r) ? `<span class="text-[10px] text-gray-400">${skipLabel(r)}</span>` : "");
      const res = r.result || {};
      const vHit = (x, lab) => x.ret ? ` <span class="text-[11px] font-bold text-red-600">${lab}的中 ${yen(x.ret)}円</span>` : ` <span class="text-[11px] text-gray-400">${lab}不的中</span>`;
      if (r.bet_v && res.v) rec += res.v_alt && r.bet_v.tickets_alt
        ? `<span class="block leading-tight">${vHit(res.v, "馬連：")}</span><span class="block leading-tight">${vHit(res.v_alt, "3連複：")}</span>` : vHit(res.v, "");
      if (r.bet && "bet_return" in res)
        rec += res.bet_return ? ` <span class="text-[11px] font-bold text-red-600">的中 ${yen(res.bet_return)}円</span>` : ' <span class="text-[11px] text-gray-400">不的中</span>';
      const ra = Object.values(res.a || {});
      const raRet = ra.reduce((a, x) => a + x.ret, 0);
      if (ra.length) rec += raRet ? ` <span class="text-[11px] font-bold text-red-600">的中 ${yen(raRet)}円</span>` : ' <span class="text-[11px] text-gray-400">不的中</span>';
      // 競馬場を横に並べる。スマホでは列が細いので、R番号を小さくし、レース名・条件を縦に積む
      const tl = tierLetter(r);
      const chip = pending(r) ? '<span class="text-[9px] text-gray-400">準備中</span>' : tl ? `<span class="tc tc-${tl}">${tl}</span>` : "";
      // 2026-11-19 利用者の希望: レースが終わったら推奨の結果（的中と払戻・不的中）をマスに出す。明るいマスは推奨度S・Aだけ。S・Aの的中は赤いマス、B・Cの的中は白いマスに赤字だけ
      const vr = r.bet_v && (r.result || {}).v, vret = vr ? vr.ret + (((r.result || {}).v_alt || {}).ret || 0) : 0;
      const resLine = vr ? (vret > 0 ? `<small class="rs hit">的中 ${yen(vret)}円</small>` : `<small class="rs">不的中</small>`) : "";
      const mcell = `<a href="#${raceId(date, r)}" class="mcell${["S", "A"].includes(tl) ? (vret > 0 ? " mh" : " ms") : r.result && !(vret > 0) ? " md" : ""}"><span class="r">${r.race}</span>` +
        `<span class="c"><span class="n">${e(r.full_name || raceNameOnly(r.name) || r.name || r.class || "")}</span>` +
        ((r.full_name || raceNameOnly(r.name)) && r.class ? `<small class="k">${e(r.class)}</small>` : "") +
        `<small>${r.start ? `<b class="st">${e(r.start)}</b> ` : ""}${surfShort(r.surface)}${r.distance || ""}</small>${resLine}</span>${chip}</a>`;   // 2026-11-21 利用者の希望: 発走時刻
      return mcell + `<a href="#${raceId(date, r)}" class="dcard flex-1 border-b border-gray-100 p-1 md:p-2 flex gap-1 md:gap-2 hover:bg-gray-50${r.bet || r.bets_a || (r.bet_v && !["新C", "新D"].includes(r.bet_v.tier)) ? " highlight-race my-0.5 rounded-sm" : ""}">` +
        `<div class="race-number">${r.race}R</div><div class="flex-1 min-w-0">` +
        `<div class="flex flex-wrap items-center gap-x-1.5 gap-y-0.5"><span class="font-bold truncate max-w-full">${e(r.full_name || r.name)}</span>${classBadge(r)}</div>` +
        `<div class="flex flex-col md:flex-row md:justify-between md:items-end mt-0.5 md:mt-1 gap-0.5"><span>${rec}</span><span class="text-gray-500 text-[10px] md:text-[11px] leading-tight">` +
        `${e(r.start || "")} ${surfShort(r.surface)}${r.distance || ""}m ${r.heads}頭</span></div></div></a>`;
    });
    return {head: `<div class="bg-white border-t-[3px] border-gray-300 px-1 md:px-2 pt-2 md:pt-3 pb-2 border-b border-dashed border-gray-400 text-center">` +
              `<div class="font-bold text-gray-700 tracking-wide text-[11px] md:text-[13px]">${head}</div>` +
              `<div class="text-gray-500 text-[10px] md:text-xs mt-1">芝：${e(turf)}　ダ：${e(dirt)}</div></div>`,
            cards: Object.fromEntries(rs.map((r, i) => [r.race, cards[i]]))};
  });
  // 競馬場を横に並べ、同じR番号のレースを同じ行にそろえる（行の高さは、その行で一番高いレースに合わせる。2026-11-08 利用者の判断）
  const maxR = Math.max(...d.races.map(r => r.race));
  const grid = cols.map(c => c.head).join("") +
    Array.from({length: maxR}, (_, i) => cols.map(c => `<div class="bg-white flex flex-col">${c.cards[i + 1] || ""}</div>`).join("")).join("");
  document.title = `${jpDate(date)} レース一覧`;
  return `<div class="mb-3"><a href="#days" class="text-blue-600 hover:underline text-xs">◀ 開催日の一覧へ</a></div>` + await dayNav(date) +
    `<h1 class="text-lg font-bold mb-1">${jpDate(date)}のレース</h1><div class="text-sm mb-3">${statsText(addStats(betStats(d, "S"), vStats(d, "新S")), "推奨度S")}${addStats(aStatsOf(d), betStats(d, "SD"), vStats(d, "新A")).bets ? `<div class="text-violet-700">${statsText(addStats(aStatsOf(d), betStats(d, "SD"), vStats(d, "新A")), "推奨度A")}</div>` : ""}${betStats(d, "B").bets ?`<div class="text-sky-700">${statsText(betStats(d, "B"), "推奨度B")}</div>` : ""}${betStats(d, "B2").bets ?`<div class="text-sky-700">${statsText(betStats(d, "B2"), "推奨度B（未勝利）")}</div>` : ""}` +
    vDay("新B") + vDay("新C") +
    "</div>" +
    `<div class="overflow-x-auto -mx-3 px-1 md:mx-0 md:px-0"><div class="day-grid shadow-sm" style="--n:${cols.length}">${grid}</div></div>`;
}

// ---------------------------------------------------------------- 出馬表・結果（タブ）と並び替え
const MARK_ORD = {"◎": 0, "○": 1, "▲": 2, "△": 3, "☆": 4, "": 5, "消": 6};
const GRADE_ORD = {"S": 0, "A": 1, "B+": 2, "B-": 3, "C": 4, "消": 5};
const DAY_ORD = {"合う": 0, "普通": 1, "合わない": 2};
const MEDAL = {1: "bg-yellow-300", 2: "bg-gray-300", 3: "bg-orange-300"};
const TD = 'class="border border-gray-300';
const num = x => { const v = parseFloat(x); return isNaN(v) ? null : v; };
const secs = t => { if (!t) return null; const [a, b] = String(t).includes(":") ? String(t).split(":") : [0, t]; return +a * 60 + +b; };
const lastPos = p => p ? +String(p).split("-").pop() : null;
const pct = x => x != null ? (x * 100).toFixed(0) + "%" : "-";
const markHtml = mk => mk ? `<span class="m-${mk}">${mk}</span>` : '<span class="text-gray-300">-</span>';
const finHtml = h => `<td ${TD} font-bold ${MEDAL[h.fin] || ""}">${h.fin || "除外"}</td>`;
const wakuHtml = h => { const w = String(h.waku ?? "").trim(); return `<td ${TD} waku-${e(w)} font-bold">${e(w)}</td>`; };

// 列の定義: [キー, 見出し, 見出しの色, 並び替えの値, セルのHTML]
function cardCols(r) {
  const cols = [];
  if (r.result) cols.push(["fin", "着順", "", h => h.fin || 99, finHtml]);
  cols.push(
    ["waku", "枠", "", h => num(h.waku), wakuHtml],
    ["num", "馬番", "", h => h.num, h => `<td ${TD} bg-gray-50 font-bold">${h.num}</td>`],
    ["mark", "AI印", "text-yellow-300", h => MARK_ORD[h.mark || ""], h => `<td ${TD}">${markHtml(h.mark)}</td>`],
    ["name", "馬名", "min-w-[120px]", h => h.name, h => `<td ${TD} font-bold text-left px-3 whitespace-nowrap pn" onclick="togglePast(${h.num}, this)">${e(h.name)}<span class="pt">過去走▼</span></td>`],
    ["age", "性齢", "", h => h.age, h => `<td ${TD}">${e(h.sex || "")}${h.age || ""}</td>`],
    ["kg", "斤量", "", h => num(h.kg), h => `<td ${TD}">${e(h.kg || "")}</td>`],
    ["jockey", "騎手", "", h => h.jockey, h => `<td ${TD} whitespace-nowrap">${e(h.jockey || "")}</td>`],
    ["odds", "単勝(人気)", "", h => h.odds, h => {
      let o = h.odds ? `${h.odds}<span class="text-[10px] text-gray-500">(${h.pop})</span>` : "-";
      if (h.odds_final && h.odds && Math.abs(h.odds_final - h.odds) >= 0.05) o += `<span class="block text-[10px] text-gray-400">確定 ${h.odds_final}</span>`;
      return `<td ${TD}">${o}</td>`; }],
    ["grade", "能力", "bg-gray-600", h => GRADE_ORD[h.grade], h => `<td ${TD} bg-gray-50 font-bold">${gcell(h.grade)}</td>`],
    ["ai", "AI評価", "bg-gray-700", h => GRADE_ORD[h.ai], h => `<td ${TD} bg-gray-50 font-bold">${gcell(h.ai)}</td>`],
    ["rec", "近走評価", "bg-gray-600", h => GRADE_ORD[h.rec], h => `<td ${TD} bg-gray-50 font-bold">${gcell(h.rec)}</td>`],
    ["day", "展開", "bg-gray-600", h => DAY_ORD[h.day], h => `<td ${TD} bg-gray-50 whitespace-nowrap">${
      {"合う": '<span class="text-green-700 font-bold">合う</span>', "合わない": '<span class="text-red-500">合わない</span>', "普通": '<span class="text-gray-500">普通</span>'}[h.day] || '<span class="text-gray-300">-</span>'}</td>`],
    ["prob", "適合度", "bg-gray-700 text-yellow-100", h => h.prob != null ? -h.prob : null, h => `<td ${TD} bg-yellow-50">${pct(h.prob)}</td>`],
    ["value", "期待値", "bg-gray-700 text-blue-100", h => h.value != null ? -h.value : null, h => {
      const v = h.value;

    ["mratio", "見落とし度", "bg-gray-700 text-amber-100", h => h.mratio != null ? -h.mratio : null, h => {
      const v = h.mratio;
      return `<td ${TD} bg-amber-50">${v == null ? "-" : v >= 1.1 ? `<span class="font-bold text-amber-700">${v.toFixed(2)}</span>` : `<span class="text-gray-600">${v.toFixed(2)}</span>`}</td>`; }],
    ["pts", "総合評価", "bg-gray-800 text-orange-200", h => h.pts != null ? -h.pts : null, h => {
      const p = h.pts;
      return `<td ${TD} bg-orange-50">${p != null && p >= 75 ? `<span class="font-bold text-red-600 text-[15px]">${p}</span>` : p != null ? `<span class="font-bold text-gray-700">${p}</span>` : "-"}</td>`; }],
    ["zi", "ZI", "text-green-300", h => h.zi != null ? -h.zi : null, h => `<td ${TD} text-green-700">${h.zi != null ? Math.round(h.zi) : "-"}</td>`],
    ["sire", "血統（父／母父）", "min-w-[130px]", h => h.sire, h => `<td ${TD} text-[11px] text-left px-2 leading-tight py-1">${e(h.sire || "")}<br><span class="text-gray-500">${e(h.damsire || "")}</span></td>`]);
  return cols;
}

let SORT = {view: "", key: "", dir: 1};

function sortTable(cols, horses, view, defKey, minW) {
  if (SORT.view !== view) SORT = {view, key: defKey, dir: 1};
  const col = cols.find(c => c[0] === SORT.key) || cols.find(c => c[0] === defKey);
  const rows = [...horses].sort((a, b) => {
    const x = col[3](a), y = col[3](b);
    if (x == null && y == null) return a.num - b.num;
    if (x == null) return 1;
    if (y == null) return -1;
    const c = typeof x === "string" ? x.localeCompare(y, "ja") : x - y;
    return c * SORT.dir || a.num - b.num;
  });
  const th = cols.map(c => {
    const on = c[0] === col[0];
    return `<th data-sort="${c[0]}" class="border border-gray-400 py-2 px-1 ${c[2]}${on ? " sort-on" : ""}">${c[1]}<span class="sort-ind">${on ? (SORT.dir > 0 ? "▲" : "▼") : "⇅"}</span></th>`;
  }).join("");
  return `<div class="overflow-x-auto"><table class="w-full ${minW} border-collapse border border-gray-300 text-center mb-4">` +
    `<thead class="table-header text-xs whitespace-nowrap"><tr>${th}</tr></thead><tbody class="text-sm">` +
    rows.map(h => `<tr class="hover:bg-gray-50${view.endsWith("card") && h.mark === "◎" ? " row-axis" : ""}">${cols.map(c => c[4](h)).join("")}</tr>`).join("") +
    `</tbody></table></div>`;
}

function payTable(pays) {
  const rows = Object.entries(pays || {}).map(([k, items]) =>
    `<tr><th class="border border-gray-300 bg-gray-100 px-3 py-1 whitespace-nowrap text-left">${k}</th><td class="border border-gray-300 px-3 py-1 text-left">` +
    items.map(t => `<span class="inline-block mr-4 whitespace-nowrap"><b>${t.nums.join(k === "馬単" || k === "3連単" ? "→" : "-")}</b> ${yen(t.pay)}円<span class="text-[11px] text-gray-500">（${t.pop ?? "-"}人気）</span></span>`).join("") +
    `</td></tr>`).join("");
  return rows ? `<table class="w-full border-collapse border border-gray-300 text-sm mb-4">${rows}</table>` : '<p class="text-gray-500 mb-4">払戻のデータがありません。</p>';
}

// どういうレースだったかとレース評価（2026-11-21 利用者の希望。app/race_eval_export.py → share_export が r.ev に入れる）
function evSection(r) {
  const v = r.ev;
  if (!v) return r.result ? `<h2 class="font-bold mb-2">このレースの内容と評価</h2><div class="stc mb-4 text-[12px] text-gray-500">レースの内容とレース評価は、成績データを取り込んだあとに出ます。</div>` : "";
  const rk = v.rk ? `<span class="gr gr-${v.rk.replace("+", "p").replace("-", "m")} evrk">${e(v.rk)}</span>` : "";
  return `<h2 class="font-bold mb-2">このレースの内容と評価</h2><div class="stc mb-4">` +
    (rk ? `<div class="flex items-center gap-2 mb-1.5"><span class="text-[11px] text-gray-500">レース評価</span>${rk}<span class="font-bold text-[13px]">${e(v.vd || "")}</span></div>` : "") +
    `<div class="text-[13px] leading-relaxed">${e(v.flow || "")}${e(v.fin || "")}</div>` +
    (v.lv && v.lv.length ? `<ul class="text-[12px] text-gray-600 mt-1.5 leading-relaxed list-disc pl-4">${v.lv.map(x => `<li>${e(x)}</li>`).join("")}</ul>` : "") +
    `<div class="text-[10px] text-gray-400 mt-1.5">レース評価はそのクラスとしてのレースのレベル（S ハイレベル・A 高め・B+ 標準・B- 低め・C 低レベル）。その日の馬場差を除いた勝ちタイムと、出走馬の近走の力から付けています。</div></div>`;
}

function resultTab(r) {
  const res = r.result || {}, rc = res.race || {};
  const box = (t, v, sub = "") => `<div class="bg-gray-50 border border-gray-200 rounded p-2 min-w-[110px]"><div class="text-[11px] text-gray-500">${t}</div><div class="font-bold">${v}</div>${sub ? `<div class="text-[11px] text-gray-500">${sub}</div>` : ""}</div>`;
  const hitPred = r.shape && rc.pace && rc.type;
  const laps = (rc.laps || []).map(x => `<span class="inline-block px-1.5 py-0.5 m-0.5 bg-gray-100 border border-gray-200 rounded text-[12px]">${x.toFixed(1)}</span>`).join("");
  let bet = "";
  if (r.bet && "bet_return" in res) {
    const hit = res.bet_return > 0;
    const T = TIER[tierOf(r)], band = {B: "20〜50倍", B2: "10〜20倍"}[tierOf(r)] || "10〜25倍";
    bet = `<div class="${hit ? "bg-yellow-100 border-yellow-400" : "bg-gray-100 border-gray-200"} p-2 rounded border mb-4"><span class="text-xs text-gray-500 block">${T.name}・AI推奨買い目（${T.kind}）の結果</span>` +
      `<span class="font-bold ${hit ? "text-red-600" : "text-gray-500"}">${hit ? `的中 ${yen(res.bet_return)}円` : "不的中"}（投資 ${yen(res.bet_cost)}円）</span>` +
      `${res.axis_final_in_band ? "" : `<span class="block text-[11px] text-gray-500">◎の確定単勝が${band}の外（実際には見送りの条件）</span>`}</div>`;
  }
  return bet + (r.bets_a ? aSection(r, true) : "") + (r.bet_v ? vSection(r, true) : "") + evSection(r) +
    `<h2 class="font-bold mb-2">レースの流れ</h2><div class="flex flex-wrap gap-2 mb-2">` +
    box("実際の展開", e(rc.shape || (r.surface === "障害" ? "障害のため対象外" : "-")), hitPred ? `AI予想: ${e(r.shape)}` : "") +
    box("前半3F", rc.f3 != null ? rc.f3.toFixed(1) : "-") + box("後半3F", rc.l3 != null ? rc.l3.toFixed(1) : "-") +
    box("前後3F差", rc.diff != null ? (rc.diff > 0 ? "+" : "") + rc.diff : "-", "＋＝前半が速い") + box("レースPCI", rc.pci ?? "-", "50超＝後半が速い") + `</div>` +
    (laps ? `<div class="mb-2"><span class="text-[11px] text-gray-500 mr-1">ラップ（1Fごと）</span>${laps}</div>` : "") +
    ((rc.corners || []).length ? `<div class="text-[12px] text-gray-600 mb-4 leading-relaxed">${rc.corners.map(e).join("<br>")}</div>` : "") +
    `<h2 class="font-bold mb-2">着順</h2>` + sortTable(resCols(r), r.horses, raceKey + "res", "fin", "min-w-[900px]") +
    `<h2 class="font-bold mb-2">払戻（100円あたり）</h2>` + payTable(rc.pays);
}

// 推奨度Aの買い目。同じ馬券が複数の案に出るときは金額を合算して1行にまとめる（案の名前は出さない）
function aTickets(r) {
  const m = new Map();
  for (const b of r.bets_a || []) for (const t of b.tickets) {
    const k = t.type + ":" + t.nums.join("-");
    if (!m.has(k)) m.set(k, {type: t.type, nums: t.nums, yen: 0});
    m.get(k).yen += t.yen;
  }
  return [...m.values()];
}
function aSection(r, withResult) {
  const tks = aTickets(r), types = ["3連複", "馬連", "ワイド"].filter(t => tks.some(x => x.type === t));
  const axes = [...new Set(r.bets_a.map(b => b.axis))];
  const fmt = typ => tks.filter(t => t.type === typ).map(t => `${t.nums.join("-")}（${yen(t.yen)}円）`).join("　");
  let res = "";
  const xs = Object.values((r.result || {}).a || {});
  if (withResult && xs.length) {
    const ret = xs.reduce((a, x) => a + x.ret, 0), cost = xs.reduce((a, x) => a + x.cost, 0);
    res = `<div class="text-[13px] mt-2 font-bold ${ret ? "text-red-600" : "text-gray-500"}">${ret ? `的中 ${yen(ret)}円` : "不的中"}（投資 ${yen(cost)}円）</div>`;
  }
  return `<div class="bg-white border border-violet-200 rounded p-3 mb-4"><div class="font-bold mb-1"><span class="badge-tiera mr-1">推奨度A</span>推奨買い目</div>` +
    `<div class="text-[12px]">◎ ${axes.join("・")}　相手 ${[...new Set(r.bets_a.flatMap(b => b.partners.concat(b.stars)))].filter(n => !axes.includes(n)).join("・")}</div>` +
    types.map(t => `<div class="text-[12px] mt-1">${t} ${fmt(t)}</div>`).join("") +
    `<div class="text-[12px] mt-1 text-gray-600">${tks.length}点・計${yen(tks.reduce((a, t) => a + t.yen, 0))}円</div>` + res +
    `<div class="text-[11px] text-gray-500 mt-2">${A_NOTE}</div></div>`;
}

// 推奨度 S・A・B・C（bet_v）の買い目
function vSection(r, withResult) {
  const b = r.bet_v, t = b.tier, T = VT[t];
  let res = "";
  const x = (r.result || {}).v;
  if (withResult && x) res = `<div class="text-[13px] mt-2 font-bold ${x.ret ? "text-red-600" : "text-gray-500"}">${x.ret ? `的中 ${yen(x.ret)}円` : "不的中"}（投資 ${yen(x.cost)}円）` +
    `${x.in_band || ["新C", "新D"].includes(t) ? "" : '<span class="block text-[11px] font-normal text-gray-500">◎の確定単勝が条件の範囲の外（実際には見送りの条件）</span>'}</div>`;
  const pts = tks => tks.map(k => k.nums.join("-")).join("　");
  const trio = (b.kind || "3連複") === "3連複" && !b.trio3, both = !!b.tickets_alt;
  const sum = tks => `${tks.length}点・計${yen(tks.reduce((a, k) => a + k.yen, 0))}円`;
  const xa = (r.result || {}).v_alt;
  const resAlt = withResult && xa ? `<div class="text-[13px] mt-1 font-bold ${xa.ret ? "text-red-600" : "text-gray-500"}">3連複 ${xa.ret ? `的中 ${yen(xa.ret)}円` : "不的中"}（投資 ${yen(xa.cost)}円）</div>` : "";
  if (b.form) {   // 新馬戦（3連複と馬連を合わせて買う形など）
    const types = [...new Set(b.tickets.map(k => k.type))];
    return `<div class="bg-white border ${T.box.split(" ")[1]} rounded p-3 mb-4"><div class="font-bold mb-1"><span class="${T.badge} mr-1">推奨度${vn(t)}</span>新馬戦の推奨買い目</div>` +
      `<div class="text-[12px] text-gray-600 mb-1">${e(b.form)}</div>` +
      `<div class="text-[12px]">◎ ${b.axis}　○▲△ ${b.partners.join("・")}　☆ ${(b.stars || []).join("・") || "なし"}${b.tier === "新C" ? "（☆は印のみ）" : ""}</div>` +
      types.map(ty => { const tk = b.tickets.filter(k => k.type === ty); return `<div class="text-[11px] text-gray-600 mt-1">${ty} ${pts(tk)}（各${yen(tk[0].yen)}円・${sum(tk)}）</div>`; }).join("") +
      `<div class="text-[12px] mt-1 text-gray-600">合計 ${sum(b.tickets)}</div>` + res +
      `<div class="text-[11px] text-gray-500 mt-2">${e(b.roi_note || "")}。新馬戦の◎は10分前の単勝と4つの特徴（厩舎・調教・父の新馬戦成績・直前に売れてきた）で決めます。消 = 10倍以上で特徴が1つも無い馬。</div></div>`;
  }
  return `<div class="bg-white border ${T.box.split(" ")[1]} rounded p-3 mb-4"><div class="font-bold mb-1"><span class="${T.badge} mr-1">推奨度${vn(t)}</span>推奨買い目（${both ? "馬連 ◎−○▲△ か 3連複 ◎−○▲△−○▲△☆☆☆☆ のどちらか" : trio ? "3連複 ◎−○▲△−○▲△☆☆☆☆" : b.trio3 ? "3連複 ◎−○▲△−○▲△" : b.kind === "単勝" ? "単勝 ◎" : `${b.kind} ◎−○▲△`}）</div>` +
    `<div class="text-[12px]">◎ ${b.axis}　○▲△ ${b.partners.join("・")}${trio || both ? `　☆ ${b.stars.join("・") || "なし"}` : (b.stars || []).length ? `　☆ ${b.stars.join("・")}（印のみ）` : (r.mark_stars || []).length ? `　☆ ${r.mark_stars.join("・")}（印のみ）` : ""}</div>` +
    `<div class="text-[11px] text-gray-600 mt-1">${b.kind || "3連複"} ${pts(b.tickets)}（各${yen(b.tickets[0].yen)}円・${sum(b.tickets)}）</div>` +
    (both ? `<div class="text-[11px] text-gray-600 mt-1">${b.alt_kind} ${pts(b.tickets_alt)}（各${yen(b.tickets_alt[0].yen)}円・${sum(b.tickets_alt)}）</div>` : "") +
    (both ? "" : `<div class="text-[12px] mt-1 text-gray-600">${sum(b.tickets)}</div>`) + (both && res ? res.replace(">的中", ">馬連 的中").replace(">不的中", ">馬連 不的中") : res) + resAlt +
    (b.label ? `<div class="text-[11px] text-gray-600 mt-1">${e(b.label)}</div>` : "") +
    `<div class="text-[11px] text-gray-500 mt-2">${e(b.roi_note || V_ROI[t] || "")}。${["新C", "新D"].includes(t) ? V_NOTE_D : V_NOTE}</div></div>`;
}

let raceKey = "", curPastKey = "", pastSrc = "";
const pastCache = {};
// 馬名を押すと過去走を開く（app/past_export.py が書く data/past/<日付>.json を、押したときだけ読む）。もう一度押すと閉じる
async function togglePast(num, el) {
  const tr = el.closest("tr");
  const nxt = tr.nextElementSibling;
  if (nxt && nxt.classList.contains("pastrow")) { nxt.remove(); return; }
  const date = pastSrc || raceKey.split("-")[0];
  const row = document.createElement("tr");
  row.className = "pastrow";
  row.innerHTML = `<td colspan="${tr.children.length}"><div class="pastbox"><div class="text-[11px] text-gray-500">読み込み中…</div></div></td>`;
  tr.after(row);
  try {
    if (!pastCache[date]) pastCache[date] = await fetch(pastSrc || `data/past/${date}.json`, {cache: "no-cache"}).then(x => x.ok ? x.json() : {});
  } catch (err) { pastCache[date] = {}; }
  const runs = pastSrc ? (pastCache[date] || {})[String(num)] : ((pastCache[date] || {})[curPastKey] || {})[String(num)];
  row.querySelector(".pastbox").innerHTML = runs && runs.length ? `<div class="text-[10px] text-gray-500">評価（右上）: S 最高評価・A 高評価・B+ 標準・B- 評価を下げる・C 最低評価。そのクラスでの絶対評価で、レースの中での走り（着差・展開の有利不利・上がり）に、レースレベル（その日の馬場差を除いた勝ちタイム・出走馬の近走の力）を含めています。同じ着順でも、高レベル戦なら上がり、低レベル戦なら下がります。</div>` + runs.map(pastRun).join("") :
    `<div class="text-[11px] text-gray-500">${pastCache[date] && Object.keys(pastCache[date]).length ? "過去走はありません（初出走）。" : "この日の過去走はまだありません（新しい開催日20日分だけ置いています）。"}</div>`;
}
function pastRun(x) {
  const [kai, place, course, going, cls, name, heads, waku, num, jockey, kg, pop, odds, fin, margin, time, hosei, passing, l3, l3r, pci, weight, gap, ai, comment, grade] = x;
  const top = /^[123]$/.test(fin);
  const aiColor = /不利で好走/.test(ai) ? "background:#e3f4ea;color:#1f7a45" : /有利で凡走|利で凡走/.test(ai) ? "background:#fde8e8;color:#b42318" :
    /好走/.test(ai) ? "background:#eef2fb;color:#2f4f8f" : "background:#f1f1f1;color:#555";
  const gcl = g => g.replace("+", "p").replace("-", "m");
  const gr = grade ? `<span class="gr gr-${gcl(grade)}">${e(grade)}</span>` : "";
  return `<div class="prun"><div>${gr}<b>${e(kai)}</b> ${e(name)}${cls && !name.normalize("NFKC").includes(cls.normalize("NFKC")) ? `（${e(cls)}）` : ""} ${e(course)} ${e(going)} ${e(heads)}頭</div>` +
    `<div><span class="fin${top ? " top" : ""}">${e(fin || "-")}着</span>${margin ? `${e(margin)}差　` : ""}${e(time)}${hosei ? `　補正${e(hosei)}` : ""}</div>` +
    `<div>${waku ? `${e(waku)}枠` : ""}${e(num)}番　${e(jockey)} ${e(kg)}　${e(pop)}人気 ${e(odds)}倍${weight ? `　${e(weight)}` : ""}${gap ? `　間隔${e(gap)}週` : ""}</div>` +
    `<div>${passing ? `通過 ${e(passing)}　` : ""}${l3 ? `上り${e(l3)}${l3r ? `（${e(l3r)}位）` : ""}` : ""}${pci ? `　PCI ${e(pci)}` : ""}</div>` +
    (ai ? `<div style="margin-top:3px"><span class="tg" style="${aiColor}">AI ${e(ai)}</span></div>` : "") +
    (comment ? `<div class="cm"><b style="color:#9a7b2f">AIのコメント</b>　${e(comment)}</div>` : "") + `</div>`;
}

async function racePage(date, pcode, rno, tab) {
  const d = await get(date);
  const r = d.races.find(x => (PLACE[x.place] || "00") === pcode && x.race === rno);
  if (!r) return '<p>このレースの予想がありません。</p>';
  raceKey = `${date}-${pcode}-${rno}`;
  pastSrc = "";
  curPastKey = `${r.place}${r.race}`;
  const id = `r-${raceKey}`;
  if (!r.result) tab = "card";
  const hdr = (r.kai ? `${r.kai}回 ${e(r.place)} ${r.nichi}日目` : e(r.place)) + (r.start ? ` ${e(r.start)}発走` : "");
  const boxes = [];
  if (pending(r)) boxes.push(`<div class="bg-gray-100 p-3 rounded border border-gray-300"><span class="font-bold text-gray-600">${PENDING_MSG}</span></div>`);
  if (r.shape && !pending(r)) boxes.push(`<div class="bg-gray-100 p-2 rounded border border-gray-200 max-w-[420px]"><span class="text-xs text-gray-500 block">AI展開予想</span>` +
    `<span class="font-bold text-[#2c3e50]">${e(r.shape)}</span><span class="block text-[11px] text-gray-500">${e(r.shape_note || "")}</span></div>`);
  if (r.bet) {
    const b = r.bet, T = TIER[tierOf(r)];
    const line = ["S", "SD"].includes(tierOf(r)) ?`◎${b.axis} − ${b.partners.join("・")} − ${b.partners.concat(b.stars).join("・")}` : tierOf(r) === "B2" ? `◎${b.axis}（単勝・複勝）` : `◎${b.axis} − ${b.partners.join("・")}（馬連・ワイド）`;
    boxes.push(`<div class="${T.box} p-2 rounded border"><span class="text-xs text-gray-500 block"><span class="${T.badge} mr-1">${T.name}</span>AI推奨買い目（${T.kind}）</span>` +
      `<span class="font-bold ${T.text}">${line}</span>` +
      `<span class="block text-[11px] text-gray-500">${b.tickets.length}点・計${yen(b.tickets.reduce((a, t) => a + t.yen, 0))}円</span></div>`);
  } else if (r.bets_a) {
    const axes = [...new Set(r.bets_a.map(b => b.axis))], tks = aTickets(r);
    boxes.push(`<div class="bg-violet-50 p-2 rounded border border-violet-200"><span class="text-xs text-gray-500 block"><span class="badge-tiera mr-1">推奨度A</span>AI推奨買い目</span>` +
      `<span class="font-bold text-violet-700">軸 ${axes.map(a => "◎" + a).join("・")}</span>` +
      `<span class="block text-[11px] text-gray-500">${tks.length}点・計${yen(tks.reduce((a, t) => a + t.yen, 0))}円</span></div>`);
  }
  if (r.bet_v) {
    const b = r.bet_v, T = VT[b.tier];
    const trio = (b.kind || "3連複") === "3連複" && !b.trio3, both = !!b.tickets_alt;
    const yenOf = tks => yen(tks.reduce((a, t) => a + t.yen, 0));
    boxes.push(`<div class="${T.box} p-2 rounded border"><span class="text-xs text-gray-500 block"><span class="${T.badge} mr-1">推奨度${vn(b.tier)}</span>AI推奨買い目（${both ? "馬連か3連複" : b.kind || "3連複"}）</span>` +
      `<span class="font-bold ${T.text}">${b.form ? `◎${b.axis} − ${b.partners.join("・")}${b.tier === "新C" ? "" : ` − ☆${(b.stars || []).join("・")}`}` : (b.kind === "単勝" ? `◎${b.axis}` : `◎${b.axis} − ${b.partners.join("・")}${trio || both ? ` − ${b.partners.concat(b.stars).join("・")}` : ""}`)}</span>` +
      `<span class="block text-[11px] text-gray-500">${both ? `馬連 ${b.tickets.length}点・${yenOf(b.tickets)}円／3連複 ${b.tickets_alt.length}点・${yenOf(b.tickets_alt)}円` : `${b.tickets.length}点・計${yenOf(b.tickets)}円`}</span></div>`);
  }
  if (noBet(r)) {
    boxes.push(`<div class="bg-gray-100 p-2 rounded border border-gray-200"><span class="text-xs text-gray-500 block">AI推奨買い目</span><span class="font-bold text-gray-500">${skipLabel(r)}</span>` +
      `<span class="block text-[11px] text-gray-500">${hasOdds(r) ? "どの推奨度の◎もいない（印は参考）" : "単勝オッズが出たら推奨度と印を決める"}</span></div>`);
  }
  const res = r.result || {};
  if (r.bet_v && res.v) {
    const both = res.v_alt && r.bet_v.tickets_alt;
    const hit = res.v.ret > 0 || (both && res.v_alt.ret > 0);
    const line = (x, lab) => `<span class="block font-bold ${x.ret ? "text-red-600" : "text-gray-500"}">${lab}${x.ret ? `的中 ${yen(x.ret)}円` : "不的中"}（投資 ${yen(x.cost)}円）</span>`;
    boxes.push(`<div class="${hit ? "bg-yellow-100 border-yellow-400" : "bg-gray-100 border-gray-200"} p-2 rounded border"><span class="text-xs text-gray-500 block">結果（推奨度${vn(r.bet_v.tier)}）</span>` +
      (both ? line(res.v, "馬連：") + line(res.v_alt, "3連複：") : line(res.v, "")) + `</div>`);
  }
  if (r.bet && "bet_return" in res) {
    const hit = res.bet_return > 0;
    boxes.push(`<div class="${hit ? "bg-yellow-100 border-yellow-400" : "bg-gray-100 border-gray-200"} p-2 rounded border"><span class="text-xs text-gray-500 block">結果</span>` +
      `<span class="font-bold ${hit ? "text-red-600" : "text-gray-500"}">${hit ? `的中 ${yen(res.bet_return)}円` : "不的中"}（投資 ${yen(res.bet_cost)}円）</span></div>`);
  }
  const xa = Object.values(res.a || {});
  if (r.bets_a && xa.length) {
    const ret = xa.reduce((a, x) => a + x.ret, 0), cost = xa.reduce((a, x) => a + x.cost, 0);
    boxes.push(`<div class="${ret ? "bg-yellow-100 border-yellow-400" : "bg-gray-100 border-gray-200"} p-2 rounded border"><span class="text-xs text-gray-500 block">結果</span>` +
      `<span class="font-bold ${ret ? "text-red-600" : "text-gray-500"}">${ret ? `的中 ${yen(ret)}円` : "不的中"}（投資 ${yen(cost)}円）</span></div>`);
  }
  let tick = "";
  if (r.bet) {
    const b = r.bet, tr = tierOf(r), T = TIER[tr];
    let lines;
    if (tr === "S" || tr === "SD") {
      const main = b.tickets.filter(t => t.yen > 100).map(t => `${t.nums.join("-")}（${t.yen}円）`).join("　");
      const sub = b.tickets.filter(t => t.yen <= 100).map(t => t.nums.join("-")).join("　");
      lines = `<div class="text-[12px]">◎ ${b.axis}　○▲△ ${b.partners.join("・")}　☆ ${b.stars.join("・") || "なし"}</div>` +
        (main ? `<div class="text-[12px] mt-1">3連複 ${main}</div><div class="text-[11px] text-gray-500 mt-1">${sub}（各100円）</div>`
              : `<div class="text-[12px] mt-1">3連複 ${sub}（各100円・${b.tickets.length}点・計${yen(b.tickets.reduce((a, t) => a + t.yen, 0))}円）</div>`);
    } else if (tr === "B2") {
      const yenOf = k => b.tickets.find(t => t.type === k).yen;
      lines = `<div class="text-[12px]">◎ ${b.axis}</div><div class="text-[12px] mt-1">単勝 ${b.axis}（${yen(yenOf("単勝"))}円）　複勝 ${b.axis}（${yen(yenOf("複勝"))}円）</div>`;
    } else {
      const by = k => b.tickets.filter(t => t.type === k).map(t => `${t.nums.join("-")}（${t.yen}円）`).join("　");
      lines = `<div class="text-[12px]">◎ ${b.axis}　○▲△ ${b.partners.join("・")}</div>` +
        `<div class="text-[12px] mt-1">馬連 ${by("馬連")}</div><div class="text-[12px] mt-1">ワイド ${by("ワイド")}</div>`;
    }
    tick = `<div class="bg-white border border-gray-200 rounded p-3 mb-4"><div class="font-bold mb-1"><span class="${T.badge} mr-1">${T.name}</span>推奨買い目（${T.kind}）</div>` +
      lines + `<div class="text-[11px] text-gray-500 mt-1">${T.note}</div></div>`;
  }
  if (r.bets_a) tick += aSection(r, false);
  if (r.bet_v) tick += vSection(r, false);
  const note = (r.odds_at ? `<div class="text-[12px] text-gray-600 mb-2">単勝は速報オッズ（${e(r.odds_at)} 発表）。期待値・推奨度もこのオッズで計算しています。</div>` : "") +
    (r.day_bias ? `<div class="text-[12px] text-gray-600 mb-2">${e(r.day_bias)}</div>` : "");
  const tabs =`<div class="flex gap-1 border-b-2 border-[#2c3e50] mb-4">` +
    `<a href="#${id}" class="tab${tab === "card" ? " tab-on" : ""}">出馬表</a>` +
    (r.result ? `<a href="#${id}-res" class="tab${tab === "res" ? " tab-on" : ""}">結果</a>` : `<span class="tab opacity-50">結果（レース後）</span>`) + `</div>`;
  const legend = `<div class="text-[11px] text-gray-500 leading-relaxed">見出しを押すと並び替え（もう一度押すと逆順）。AI印：◎＝軸（推奨度S：オープン以上・芝で単勝10〜25倍×能力S/A（同じ条件のダートは推奨度A）、推奨度B：3勝クラスで単勝20〜50倍×能力S/A、推奨度A：3勝芝で単勝20〜30倍・ランクB+以上・能力÷市場1.2以上。見落とし度の推奨度（S：1勝・3勝芝・オープン以上芝の馬連、A：3勝ダートの3連複・オープン以上ダートの馬連、C：未勝利・2勝の馬連）：単勝10〜20倍で見落とし度1.1以上。上の推奨度と重なったら1つだけ出す（芝は上の推奨度、ダートは見落とし度）。ほかの推奨度が付かないレースは推奨度D（単勝6.9倍以下×能力S・A×見落とし度1.0以上から◎、ワイド ◎−○▲△ 各500円で1,500円）。オッズが出る前は付かない。新馬戦は別の決め方：推奨度Bは◎10〜20倍で特徴3つ以上、推奨度Cはそれ以外のレースで特徴の多い馬が◎、3連複 ◎−○▲△）／○▲△＝能力上位3頭（見落とし度の推奨度は見落とし度1.0以上から能力順）／☆＝能力4〜7位（推奨度Sの3連複）、見落とし度0.9〜1.0を人気順（それ以外。馬連のレースでは印だけで買い目には入れない）／消＝能力20点未満。` +
    `見落とし度＝オッズ以外の材料も入れた3着内確率 ÷ 単勝オッズだけの3着内確率（オッズが入ってから出る）。` +
    `能力＝新適合度のランク（S・A・B+・B-・C。20点未満の「消」も C で表示）。AI評価＝能力の点に見落とし度を足した総合の5段階（印を決める材料と同じ。オッズが出る前は能力だけ）。近走評価＝近3走の評価（過去走の右上の S〜C。新しい走りほど重く、今回とのクラスの差で上げ下げ）をまとめた5段階（スマホは馬名の下。過去走が無い馬は出ない）。展開＝当日の前のレースの傾向への合い方。適合度＝オッズ抜きの3着内確率。` +
    `期待値＝適合度 ÷ 単勝オッズから見込まれる3着内率（100%超＝能力のわりに人気がない）。総合評価＝新適合度の100点。${r.odds_at ? "" : "単勝は出馬表を出した時点。"}</div>`;
  const W = {1: "waku-1", 2: "waku-2", 3: "waku-3", 4: "waku-4", 5: "waku-5", 6: "waku-6", 7: "waku-7", 8: "waku-8"};
  const mrows = [...(r.horses || [])].sort((a, b) => a.num - b.num).map(h => `<tr class="${h.mark === "◎" ? "ax" : ""}"><td><span class="wk ${W[h.waku] || ""}" style="${h.waku === 1 ? "border:1px solid #ddd" : ""}">${h.waku || ""}</span></td>` +
    `<td class="num font-extrabold">${h.num}</td><td><span class="m-${h.mark || ""}">${h.mark || ""}</span></td>` +
    `<td class="nm pn" onclick="togglePast(${h.num}, this)">${e(h.name)}<span class="pt">過去走▼</span><small>${e(h.sex || "")}${h.age || ""}・${e(h.jockey || "")}・${h.kg || ""}${h.rec ? `・近走<span class="${gcls(h.rec)}">${e(h.rec)}</span>` : ""}</small></td>` +
    `<td class="num font-bold">${h.odds ?? "-"}</td><td class="num">${h.pop ?? "-"}</td><td class="font-bold">${gcell(h.grade)}</td><td class="font-bold">${gcell(h.ai)}</td></tr>`).join("");
  const mtable = `<table class="mtbl mb-2"><tr><th>枠</th><th>番</th><th>印</th><th style="text-align:left">馬名</th><th>単勝</th><th>人気</th><th>能力</th><th>AI</th></tr>${mrows}</table>`;
  const aiSec = `<div class="sec-h" id="ai">AIの印と買い目</div><div class="flex flex-wrap gap-2 mb-3">${boxes.join("")}</div>` + tick;
  const body = tab === "res" ? resultTab(r) + `<div class="flex flex-wrap gap-2 mt-3">${boxes.join("")}</div>` :
    note + mtable + `<div class="dtable">${sortTable(cardCols(r), r.horses, raceKey + "card", "num", "min-w-[1100px]")}</div>` + aiSec + legend;
  document.title = `${r.race}R ${r.full_name || r.name}`;
  return `<div class="bg-white border-t-[4px] border-[#2c3e50] shadow-md p-4 md:p-6">` +
    `<div class="mb-4"><a href="#d-${date}" class="text-blue-600 hover:underline text-xs">◀ レース一覧へ戻る</a></div>` + raceNav(date, d, r, tab) +
    `<div class="flex flex-col gap-3 pb-2 mb-2"><div><div class="text-gray-500 text-sm mb-1">${jpDate(date)}　${hdr}</div>` +
    `<h1 class="text-2xl font-bold flex flex-wrap items-center gap-2">${r.race}R ${e(r.full_name || r.name)} ${classBadge(r)}</h1>` +
    `<div class="text-gray-600 text-sm mt-1">${e(r.surface)}${r.distance || ""}m / 馬場: ${e(r.track || "-")} / ${r.heads}頭</div></div>` +
    `</div>${tabs}${body}</div>`;
}

async function route(keepScroll) {
  const h = location.hash.slice(1);
  let m;
  let isHome = false;
  try {
    if (h === "latest") { const dl = currentDate((await get("days")).map(x => x.date)); app.innerHTML = await dayPage(dl); lastDate = dl; }
    else if (h === "about") { app.innerHTML = await aboutPage(); }
    else if (h === "tiers") { app.innerHTML = await tiersPage(); }
    else if (h === "stats") { app.innerHTML = await statsPage(); }
    else if (h === "days") { app.innerHTML = await daysPage(); }
    else if ((m = h.match(/^h-(\d{8})-(\d{2})-(\d{1,2})(-res)?$/))) { app.innerHTML = await histRacePage(m[1], m[2], +m[3], m[4] ? "res" : "card"); }
    else if ((m = h.match(/^d-(\d{8})$/))) { app.innerHTML = await dayPage(m[1]); lastDate = m[1]; }
    else if ((m = h.match(/^r-(\d{8})-(\d{2})-(\d{1,2})(-res)?$/))) { app.innerHTML = await racePage(m[1], m[2], +m[3], m[4] ? "res" : "card"); lastDate = m[1]; }
    else { app.innerHTML = await home(); isHome = true; }
  } catch (err) {
    app.innerHTML = `<p class="text-gray-500">データを読み込めませんでした（${e(err.message)}）。<a href="#top" class="text-blue-600 underline">ホームへ</a></p>`;
  }
  const tabOf = ["stats", "about", "tiers"].includes(h) || h.startsWith("h-") ? (h.startsWith("h-") ? "stats" : h) : isHome ? "home" : "day";
  document.querySelectorAll(".bnav a").forEach(a => a.classList.toggle("on", a.dataset.tab === tabOf));
  const seen = h === "days" && lastDate && document.getElementById(`day-${lastDate}`);
  const backH = h === "stats" && !keepScroll && lastHist && document.getElementById(`hr-${lastHist}`);   // 過去の重賞から戻ったら、その行まで
  if (backH) { backH.scrollIntoView({block: "center"}); lastHist = ""; }
  else if (seen) seen.scrollIntoView({block: "center"});
  else if (!keepScroll) window.scrollTo(0, 0);
}
app.addEventListener("click", ev => {
  const th = ev.target.closest("th[data-sort]");
  if (!th) return;
  const k = th.dataset.sort;
  SORT.dir = SORT.key === k ? -SORT.dir : 1;
  SORT.key = k;
  route(true);
});
app.addEventListener("click", ev => {   // 推奨度の一覧・ホームから成績へ、条件を入れて移る
  const a = ev.target.closest("[data-sf]");
  if (a) Object.assign(STATS_F, JSON.parse(a.dataset.sf));
  const g = ev.target.closest("[data-g]");   // 重賞ヒストリーのグレード（複数選択）
  if (g) { GRADE_F.has(g.dataset.g) ? GRADE_F.delete(g.dataset.g) : GRADE_F.add(g.dataset.g); GRADE_LIMIT = 50; route(true); }
  const yb = ev.target.closest("[data-y]");   // 重賞ヒストリーの年（複数選択。全期間で解除）
  if (yb) { const y = yb.dataset.y; if (!y) YEAR_F.clear(); else YEAR_F.has(y) ? YEAR_F.delete(y) : YEAR_F.add(y); GRADE_LIMIT = 50; route(true); }
  if (ev.target.closest("[data-more]")) { GRADE_LIMIT += 100; route(true); }
});
app.addEventListener("change", ev => {
  const f = ev.target.closest("select[data-f]");
  if (f) { STATS_F[f.dataset.f] = f.value; route(true); return; }
  const s = ev.target.closest("select[data-nav]");
  if (s) location.hash = s.value;
});
addEventListener("hashchange", () => route(false));
route(false);
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
