<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI競馬予想</title>

<script src="https://cdn.tailwindcss.com/3.4.5"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{font-family:'Noto Sans JP',sans-serif;background:#f2f2f2;color:var(--text)}
.race-number{background:#e44f4f;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;width:34px;height:34px;font-size:13px;flex-shrink:0}
.badge-gray{background:#a8a8a8;color:#fff;font-size:10px;padding:1px 8px;border-radius:10px;white-space:nowrap}
.badge-blue{background:#5c6db3;color:#fff;font-size:10px;padding:1px 8px;border-radius:10px;white-space:nowrap}
.badge-rec{background:#e44f4f;color:#fff;font-size:10px;padding:1px 6px;border-radius:3px;white-space:nowrap}
.badge-tierb{background:#0284c7;color:#fff;font-size:10px;padding:1px 6px;border-radius:3px;white-space:nowrap}
.badge-tiera{background:#7c3aed;color:#fff;font-size:10px;padding:1px 6px;border-radius:3px;white-space:nowrap}
.badge-vs{background:#b45309;color:#fff;font-size:10px;padding:1px 6px;border-radius:3px;white-space:nowrap}
.badge-va{background:#047857;color:#fff;font-size:10px;padding:1px 6px;border-radius:3px;white-space:nowrap}
.badge-vc{background:#6b7280;color:#fff;font-size:10px;padding:1px 6px;border-radius:3px;white-space:nowrap}
.badge-vd{background:#9ca3af;color:#fff;font-size:10px;padding:1px 6px;border-radius:3px;white-space:nowrap}
.highlight-race{background:#fff8dc;border:1px solid #f2e2a7}
.table-header{background:#3f4854;color:#fff}
.waku-1{background:#fff;color:#333}.waku-2{background:#333;color:#fff}.waku-3{background:#d93b3b;color:#fff}.waku-4{background:#2b70d6;color:#fff}
.waku-5{background:#e6c300;color:#333}.waku-6{background:#2e8b57;color:#fff}.waku-7{background:#ff8c00;color:#fff}.waku-8{background:#ff99cc;color:#333}
.m-◎{color:#e63946;font-size:1.25rem;font-weight:900}.m-○,.m-▲{color:#333;font-size:1.2rem;font-weight:900}.m-△{color:#666;font-size:1.1rem;font-weight:700}
.m-☆{color:#d4a900;font-size:1.1rem;font-weight:900}.m-消{color:#aaa;font-size:.8rem}
.g-S{color:#e63946;font-weight:700}.g-A{color:#2b70d6;font-weight:700}.g-Bp{color:#c9a300;font-weight:700}.g-Bm{color:#777}.g-C{color:#999}.g-消{color:#bbb}
.row-axis{background:#fffacd}
.day-grid{display:grid;grid-template-columns:repeat(var(--n),minmax(112px,1fr));column-gap:4px}
@media (min-width:768px){.day-grid{grid-template-columns:repeat(var(--n),320px);column-gap:16px;width:max-content}}
@media (max-width:767px){.race-number{width:24px;height:24px;font-size:10px}.badge-gray,.badge-blue{font-size:9px;padding:0 5px}.badge-rec,.badge-tierb,.badge-tiera,.badge-vs,.badge-va,.badge-vc,.badge-vd{font-size:9px;padding:0 4px}}
th[data-sort]{cursor:pointer;user-select:none}th[data-sort]:hover{background:#56606d}
.sort-ind{font-size:9px;margin-left:2px;opacity:.5}.sort-on .sort-ind{opacity:1;color:#fde047}
.tab{padding:8px 18px;font-weight:700;border:1px solid #d1d5db;border-bottom:none;background:#e5e7eb;color:#4b5563;border-radius:4px 4px 0 0}
.tab-on{background:#2c3e50;color:#fff;border-color:#2c3e50}

/* 2026-11-18 スマホアプリ風（紺と金）。アイコンは make_icon.py */
:root{--ink:#0f1b2d;--ink2:#1b2a41;--gold:#c9a24b;--gold2:#e8cf8f;--paper:#f6f3ec;--line:#e7e1d4;--muted:#7a7f8a;--card:#fff;--text:#1f2937}
body{background:var(--paper)}
.num{font-family:'Inter','Noto Sans JP',sans-serif;font-feature-settings:"tnum"}
.appbar{background:linear-gradient(160deg,var(--ink),var(--ink2))}
.tc{font-family:'Inter',sans-serif;font-weight:800;font-size:11px;min-width:20px;height:20px;padding:0 4px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#fff}
.tc-S{background:linear-gradient(135deg,#e8cf8f,#b48a2f);color:#2b1f05}
/* 2026-11-27 利用者の希望: 推奨（推奨度S・A）と推奨外（B・C）の2つで見せる */
.rc{font-weight:800;font-size:11px;height:20px;padding:0 8px;border-radius:999px;display:inline-flex;align-items:center;white-space:nowrap;flex:none}
.rc-on{background:linear-gradient(135deg,#e8cf8f,#b48a2f);color:#2b1f05}
.rc-off{background:#eef0f3;color:#7b818c;font-weight:700}
.rc-big{height:26px;font-size:13px;padding:0 11px}
.rc-sup{background:linear-gradient(135deg,#ff7a6b,#c0262d);color:#fff}  /* 2026-11-28 超推奨（トライアル） */
.xrc.sa.sup{border-left:4px solid #c0262d}
.arr{display:inline-block;font-size:10px;font-weight:700;line-height:1;padding:3px 5px;border-radius:5px;margin-left:5px;vertical-align:2px;white-space:nowrap;flex:none}.arr-0{background:#fde2e2;color:#c0262d}.arr-1{background:#fde9d4;color:#c2560c}.arr-2{background:#fdf3c7;color:#946200}.arr-3{background:#eceef1;color:#5b6270}.arr-4{background:#dcf2e6;color:#1d7a4c}
.ash{display:inline-flex;gap:2px;margin-left:4px;vertical-align:-1px}.ash i{font-style:normal;font-size:9px;font-weight:800;line-height:1;width:13px;height:13px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center}
.ash-p{background:#1f3a5f;color:#fff}.ash-a{background:#d23b3b;color:#fff}.ash i.ash-m{width:25px;background:linear-gradient(115deg,#1f3a5f 0 50%,#d23b3b 50% 100%);color:#fff;letter-spacing:-.5px}.tc-A{background:#2f8f6b}.tc-B{background:#3a7bd5}.tc-C{background:#a3a7b0}
.hero{border-radius:18px;padding:14px;background:linear-gradient(160deg,var(--ink),var(--ink2));color:#fff;border:1px solid rgba(232,207,143,.35)}
.hero .gl{border-radius:14px;padding:12px;background:linear-gradient(135deg,rgba(201,162,75,.22),rgba(201,162,75,.06));border:1px solid rgba(232,207,143,.3)}
.lst{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.lst>a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #f0ebe0}
.lst>a:last-child{border-bottom:none}
.rnb{width:30px;height:30px;border-radius:10px;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--text)}
.stc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.bnav{display:none}
.mcell{display:none}
.mtbl{display:none}
.pn{cursor:pointer}.pn .pt{font-size:9px;color:#9a7b2f;font-weight:600;margin-left:3px}
.pastbox{padding:6px 6px 8px;display:flex;flex-direction:column;gap:6px}
.prun{background:var(--card);border:1px solid #ece4d3;border-radius:8px;padding:6px 8px;font-size:11px;line-height:1.45;color:#3b3f46}
.prun .fin{font-family:'Inter',sans-serif;font-weight:800;font-size:15px;margin-right:4px}.prun .fin.top{color:#d64545}
.prun .tg{display:inline-block;border-radius:4px;padding:0 5px;font-size:10px;font-weight:700;margin-right:4px}
.prun .gr{float:right;min-width:26px;text-align:center;border-radius:6px;padding:1px 6px;font-family:'Inter',sans-serif;font-weight:800;font-size:13px;margin-left:6px}
.grc{display:inline-block;min-width:26px;text-align:center;border-radius:6px;padding:1px 6px;font-family:'Inter',sans-serif;font-weight:800;font-size:13px}
.gr-S{background:#d4a017;color:#fff}.gr-A{background:#2f8f5b;color:#fff}.gr-Bp{background:#dbe7fb;color:#2f4f8f}.gr-Bm{background:#eceef1;color:#6b6f76}.gr-C{background:#fde8e8;color:#b42318}
.evrk{display:inline-block;min-width:32px;text-align:center;border-radius:7px;padding:2px 8px;font-family:'Inter',sans-serif;font-weight:800;font-size:16px}
.prun .cm{color:#3b3f46;font-size:11px;margin-top:3px;line-height:1.55;white-space:pre-line}
.chips{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.chips>div{display:flex;align-items:baseline}.chips small{font-size:10px;color:var(--muted);margin-left:1px}
.tcard{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.fbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:12px}
.fsel{display:flex;flex-direction:column;gap:2px;font-size:10px;color:var(--muted);font-weight:700}
.fsel select{font-size:13px;font-weight:700;color:var(--text);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.gb{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:17px;padding:0 4px;border-radius:4px;font-family:'Inter',sans-serif;font-weight:800;font-size:10px;color:#fff;flex-shrink:0}
.gb-G1{background:#1d4ed8}.gb-G2{background:#dc2626}.gb-G3{background:#15803d}.gb-L{background:#7c6a46}.gb-OP{background:#6b7280}
.gchip{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 5px;font-size:12px;font-weight:700;color:var(--muted);opacity:.55}
.gchip.on{opacity:1;border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;color:var(--text)}
.lst.hl>a,.lst.hl>div{display:block;gap:0}.hrow{display:block;padding:9px 12px;border-bottom:1px solid #f0ebe0}.hrow:last-child{border-bottom:none}
.htbl{width:100%;border-collapse:collapse;background:var(--card);font-size:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.htbl th{background:var(--ink);color:var(--gold2);font-size:10px;padding:6px 3px;font-weight:700}
.htbl td{padding:5px 3px;border-bottom:1px solid #f0ebe0;text-align:center;white-space:nowrap}
.htbl td.nm{text-align:left;font-weight:700;white-space:normal}.htbl td.nm small{display:block;font-weight:400;color:var(--muted);font-size:10px}
.htbl tr.ax td{background:#fff8e6}
.htbl tr.pastrow td{white-space:normal;text-align:left;padding:0;background:#faf8f3}
.sec-h{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:18px 2px 8px}
@media (max-width:767px){
  main#app{padding-bottom:96px}
  .bnav{display:flex;position:fixed;left:10px;right:10px;bottom:10px;z-index:50;background:var(--ink);border-radius:22px;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 10px 30px rgba(15,27,45,.35);transform:translate3d(0,0,0);-webkit-transform:translate3d(0,0,0);will-change:transform}
  /* 2026-11-24 利用者の報告: スクロールすると下のメニューが画面の途中まで動く（iPhone で、ページ全体がスクロールすると固定のメニューがずれる）
     → ページ全体は動かさず、中身（#scroller）だけをスクロールする */
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  #scroller{position:fixed;top:0;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;color:#8e97a6;min-width:52px}
  .bnav a svg{width:22px;height:22px}
  .bnav a.on{color:var(--gold2)}
  .day-grid{grid-template-columns:repeat(var(--n),minmax(0,1fr));column-gap:3px}
  .dcard{display:none!important}
  .mcell{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 4px;margin:1.5px 0;min-height:30px}
  .mcell .r{font-family:'Inter',sans-serif;font-weight:800;font-size:11px;color:var(--text)}
  .mcell .c{font-size:10px;line-height:1.15;color:#4b4f57;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mcell .c small{display:block;font-size:9px;color:var(--muted)}
  .mcell .c small.k{color:#8a6a1f;font-weight:700}
  .mcell .c small .st{font-family:'Inter',sans-serif;font-weight:700;color:var(--text)}
  .mcell .c .n{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal;overflow:hidden;word-break:break-all;font-weight:600;color:var(--text)}
  .mcell .tc{min-width:17px;height:17px;font-size:9px;border-radius:5px;padding:0 3px}
  .mcell.ms{background:#fffaf0;border-color:#e8cf8f}
  .mcell.md{opacity:.55}
  .mcell.mh{background:#ffdfe5;border:1.5px solid #e0566c}
  .mcell .c small.rs{color:#6b6f76;font-weight:600}
  .mcell .c small.rs.hit{color:#d64545;font-weight:800}
  .mtbl{display:table;width:100%;border-collapse:collapse;background:var(--card);font-size:12px;border:1px solid var(--line)}
  .mtbl th{background:var(--ink);color:var(--gold2);font-size:10px;padding:6px 3px;font-weight:700}
  .mtbl td{padding:5px 3px;border-bottom:1px solid #f0ebe0;text-align:center;white-space:nowrap}
  .mtbl td.nm{text-align:left;font-weight:700}
  .mtbl td.nm small{display:block;font-weight:400;color:var(--muted);font-size:10px}
  .mtbl tr.ax td{background:#fff8e6}
  .mtbl tr.pastrow td{white-space:normal;text-align:left;padding:0;background:#faf8f3}
  .mtbl .wk{display:inline-flex;width:20px;height:20px;border-radius:5px;align-items:center;justify-content:center;font-weight:800;font-size:11px}
  .dtable{display:none}
}

/* 2026-11-24 利用者の判断: 見本（app/mockup）のアプリらしい画面を本番に。新しい部品は x で始まる名前 */
.xback{font-size:30px;line-height:1;color:var(--gold2);padding:0 6px 2px 0;font-weight:300}
.xbar-t{font-size:16px;font-weight:800;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}  /* 2026-11-28 長いレース名も核の部分まで出す（2行まで） */
.xbar-s{display:block;font-size:11px;color:#aab3c2;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xst{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;white-space:nowrap;line-height:1.5}
.xst.wait{background:#eceef1;color:#6b7280}.xst.prov{background:#fff1d6;color:#a16207}.xst.fix{background:#dcfce7;color:#15803d}.xst.run{background:#e0e7ff;color:#3730a3}.xst.res{background:#f1f1f1;color:#666}.xst.pend{background:#f3f4f6;color:#9ca3af}
.xcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.xseg{display:flex;background:rgba(127,127,127,.14);border-radius:12px;padding:3px;margin-bottom:12px}
.xseg>a,.xseg>span{flex:1;text-align:center;padding:8px 0;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.xseg>a.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.xseg>span{opacity:.45}
.xchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.xchips::-webkit-scrollbar{display:none}
.xchip{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:13px;color:var(--text);white-space:nowrap}
.xchip.on{background:var(--ink);color:var(--gold2);border-color:var(--text)}
.xchip.sm{padding:5px 0;min-width:40px;text-align:center;font-size:12px;position:relative}
.xchip .dot{position:absolute;top:2px;right:4px;width:6px;height:6px;border-radius:50%}
.xrc{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.xrc.sa{border-left:4px solid var(--gold)}
.xrc.hit{background:#fff1f2;border-color:#f3b4bd}
.xrc.dim{opacity:.6}
.xrc .no{width:42px;height:42px;border-radius:12px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:16px;flex:none;color:var(--text);font-family:'Inter','Noto Sans JP',sans-serif}
.xrc .no small{font-size:10px;color:var(--muted);font-weight:700;line-height:1}
.xrc .no.t{font-size:13px}
.xrc .mid{flex:1;min-width:0}
.xrc .nm{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.xrc .nm{display:block;white-space:normal;line-height:1.3;word-break:break-all}.xrc .nm .arr{vertical-align:1px}  /* 2026-11-28 レース名は折り返して全部出す */
.xrc .sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xrc .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.xtog{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 10px;font-size:13px;font-weight:700;color:var(--text)}
.xsw{width:46px;height:28px;border-radius:999px;background:#c9ced6;position:relative;border:none;flex:none}
.xsw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.xsw.on{background:#34c759}.xsw.on::after{left:21px}
.xbtn{flex:1;padding:11px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:800;font-size:13px;color:var(--text)}
.xbtn.pri{background:var(--gold);border-color:var(--gold);color:#1c1405}
.xbtn.done{background:#059669;border-color:#059669;color:#fff}
.xpill{display:inline-flex;align-items:center;gap:3px;background:var(--paper);border-radius:10px;padding:5px 9px;font-weight:800;font-size:13px;color:var(--text)}
.xhz{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid #f0ebe0}
.xhz.ax{background:#fff8e6}
.xhz .wkb{width:6px;align-self:stretch;border-radius:3px;flex:none}
.xhz .n{width:24px;text-align:center;font-weight:900;font-size:15px;flex:none;font-family:'Inter',sans-serif;color:var(--text)}
.xhz .f{width:26px;text-align:center;font-weight:900;font-size:17px;flex:none;font-family:'Inter',sans-serif}
.xhz .mk{width:22px;text-align:center;flex:none}
.xhz .hn{flex:1;min-width:0}.xhz .hn b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.xhz .hn small{color:var(--muted);font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xhz .hn .fit{text-overflow:clip}
.xhz.rr{gap:5px}.xhz.rr .f{width:20px}.xhz.rr .n{width:19px}.xhz.rr .mk{width:17px}.xhz.rr .od{min-width:42px}.xhz.rr .grc{min-width:24px;padding:1px 4px}
.xhz .od{text-align:right;min-width:50px;flex:none}.xhz .od b{font-size:16px;font-family:'Inter',sans-serif;color:var(--text)}.xhz .od small{display:block;font-size:10px;color:var(--muted)}
.xgb{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:20px;padding:0 4px;border-radius:6px;font-size:11px;font-weight:900;background:#eef0f3;color:#6b7280;flex:none;font-family:'Inter',sans-serif}
.xgb.S{background:#fde9b5;color:#7a5a00}.xgb.A{background:#d7f2e2;color:#1d6b43}.xgb.Bp{background:#dbe7fb;color:#2f4f8f}

const sumRows = rows => {
  const done = rows.filter(x => x[7] > 0);
  const cost = done.reduce((a, x) => a + x[7], 0), ret = done.reduce((a, x) => a + x[8], 0);
  let streak = 0, worst = 0;
  const key = x => x[0] + String(x[2]).padStart(2, "0") + x[1];
  const hit = x => x[8] - (x[13] || 0) > 0;   // 返還（取消・除外）だけのレースは的中に数えない（14列目 = 返還）
  for (const x of [...done].sort((a, b) => key(a).localeCompare(key(b)))) { streak = hit(x) ? 0 : streak + 1; worst = Math.max(worst, streak); }
  return {n: rows.length, done: done.length, hits: done.filter(hit).length, cost, ret, roi: cost ? Math.round(ret / cost * 100) : null, worst, cur: streak};
};

// 過去の重賞の結果タブ（2026-11-21 利用者の希望: いつものレースの結果と同じ中身）。resultTab に渡せる形に組み直す
// det.hr = {馬番: [タイム, 着差, 通過, 上がり3F, 馬体重, PCI, 確定人気, 確定単勝]}、det.rc = レースの流れ・ラップ・通過順・払戻（share_export）
const wakuOf = (n, heads) => {   // JRA の枠の決め方: 8頭までは馬番＝枠、それより多いと外の枠から2頭（3頭）になる
  if (heads <= 8) return n;
  const base = Math.floor(heads / 8), rem = heads % 8;
  let c = 0;
  for (let w = 1; w <= 8; w++) { c += base + (w > 8 - rem ? 1 : 0); if (n <= c) return w; }
  return 8;
};
function histResult(x, det, bet = "") {
  if (!det.rc && !Object.keys(det.hr || {}).length) return `<div class="sec-h">着順</div><p class="text-gray-500">結果の詳しいデータがありません。</p>` + bet;
  const heads = det.h.length;
  const horses = det.h.map(h => {
    const v = (det.hr || {})[h[0]] || [];
    return {num: h[0], name: h[1], jockey: h[2], odds: h[3], pop: h[4], fin: h[5], grade: h[6], mark: h[7], ai: h[8], rec: h[9], waku: wakuOf(h[0], heads),
            time: v[0], margin: v[1], pos: v[2], l3f: v[3], weight: v[4], hpci: v[5], rpop: v[6], odds_final: v[7]};
  });
  return resultTab({horses, surface: x.s === "芝" ? "芝" : "ダート", result: {race: det.rc || {}}, ev: det.ev}, bet);
}

let STATS_TAB = "main";   // 成績の画面の切り替え（main = 成績、graded = 重賞ヒストリー）
// 収支のグラフ（2026-11-24）: 1系列だけなので凡例なし。押す（PC はマウスを乗せる）と下に値が出る
function plChart(rows) {
  const done = rows.filter(x => x[7] > 0).sort((a, b) => a[0].localeCompare(b[0]));
  if (done.length < 2) return "";
  const byDay = new Map();
  for (const x of done) byDay.set(x[0], (byDay.get(x[0]) || 0) + x[8] - x[7]);
  let acc = 0;
  const pts = [...byDay].map(([d, v]) => [d, acc += v]);
  const W = 340, H = 150, L = 4, R = 4, T = 10, B = 18;
  const ys = pts.map(p => p[1]), lo = Math.min(0, ...ys), hi = Math.max(0, ...ys), span = hi - lo || 1;
  const X = i => L + (W - L - R) * (pts.length === 1 ? 0.5 : i / (pts.length - 1)), Y = v => T + (H - T - B) * (1 - (v - lo) / span);
  const path = pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
  const last = pts[pts.length - 1], col = last[1] >= 0 ? "#2f8f6b" : "#b4533c";
  const md = d => `${+d.slice(4, 6)}/${+d.slice(6)}`;
  const hits = pts.map((p, i) => `<rect x="${(X(i) - (W / pts.length) / 2).toFixed(1)}" y="0" width="${Math.max(W / pts.length, 4).toFixed(1)}" height="${H}" fill="transparent" data-tip="${md(p[0])}までの収支 ${p[1] >= 0 ? "+" : ""}${yen(p[1])}円"></rect>`).join("");
  return `<div class="xcard"><div class="flex items-baseline"><b class="text-[13px]">収支の推移</b><span class="ml-auto num font-extrabold ${last[1] >= 0 ? "text-emerald-700" : ""}">${last[1] >= 0 ? "+" : ""}${yen(last[1])}円</span></div>` +
    `<svg viewBox="0 0 ${W} ${H}" class="w-full mt-1" role="img" aria-label="収支の推移">` +
    `<line x1="${L}" x2="${W - R}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="#d9d4c7" stroke-width="1" stroke-dasharray="3 3"/>` +
    `<path d="${path}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` +
    `<circle cx="${X(pts.length - 1).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="4" fill="${col}" stroke="#fff" stroke-width="2"/>` +
    `<text x="${L}" y="${H - 4}" font-size="10" fill="#8a8f98">${md(pts[0][0])}</text><text x="${W - R}" y="${H - 4}" font-size="10" fill="#8a8f98" text-anchor="end">${md(last[0])}</text>` +
    `<text x="${W - R}" y="${(Y(0) - 4).toFixed(1)}" font-size="9" fill="#8a8f98" text-anchor="end">0円</text>${hits}</svg>` +
    `<div class="xtip text-[11px] text-gray-500 h-4">グラフを押すと、その日までの収支が出ます</div></div>`;
}
function monthChart(rows, months) {
  if (months.length < 2) return "";
  const ms = [...months].sort().slice(-12);
  const vals = ms.map(m => { const x = sumRows(rows.filter(r => r[0].startsWith(m))); return [m, x.ret - x.cost, x.roi]; });
  const W = 340, H = 130, T = 8, B = 18, gap = 2, bw = (W - gap * (ms.length - 1)) / ms.length;
  const mx = Math.max(1, ...vals.map(v => Math.abs(v[1]))), lo = Math.min(0, ...vals.map(v => v[1])), hi = Math.max(0, ...vals.map(v => v[1])), span = hi - lo || 1;
  const Y = v => T + (H - T - B) * (1 - (v - lo) / span), y0 = Y(0);
  const bars = vals.map(([m, v, r], i) => {
    const x = i * (bw + gap), y = Math.min(Y(v), y0), h = Math.max(Math.abs(Y(v) - y0), 1.5);
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${v >= 0 ? "#2f8f6b" : "#c9a3a0"}" data-tip="${m.slice(0, 4)}年${+m.slice(4)}月 ${v >= 0 ? "+" : ""}${yen(v)}円（回収率${r ?? "-"}%）"></rect>` +
      `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 4}" font-size="9" fill="#8a8f98" text-anchor="middle">${+m.slice(4)}月</text>`;
  }).join("");
  return `<div class="xcard"><b class="text-[13px]">月ごとの収支</b><svg viewBox="0 0 ${W} ${H}" class="w-full mt-1" role="img" aria-label="月ごとの収支">` +
    `<line x1="0" x2="${W}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}" stroke="#d9d4c7" stroke-width="1"/>${bars}</svg>` +
    `<div class="xtip text-[11px] text-gray-500 h-4">棒を押すと、その月の収支が出ます（緑＝プラス）</div></div>`;
}

const NAV_BTN = "px-3 py-1.5 bg-white border border-gray-300 rounded text-xs font-bold text-[#2c3e50]";
// 開催日の移動（1日前の開催／日付選択／1日後の開催）
async function dayNav(date) {

// 出馬表の上のレース移動（同じ日の全開催を場ごとに1R〜12Rのボタンで）。結果タブを見ているときは移動先も結果タブ
function raceNav(date, d, cur, tab) {
  const rows = [...new Set(d.races.map(x => x.place))].map(pl => {
    const btns = d.races.filter(x => x.place === pl).sort((a, b) => a.race - b.race).map(x => {
      const on = x === cur;
      return `<a href="#${raceId(date, x)}${tab === "res" && x.result ? "-res" : ""}"${on ? ' aria-current="page"' : ""} class="block text-center py-1 rounded text-xs font-bold border ${on ? "bg-[#2c3e50] text-white border-[#2c3e50]" : "bg-white text-[#2c3e50] border-gray-300 hover:bg-yellow-50"}">${x.race}</a>`;
    }).join("");
    return `<div class="flex items-center gap-2"><span class="w-9 shrink-0 text-xs font-bold ${pl === cur.place ? "text-[#2c3e50]" : "text-gray-500"}">${e(pl)}</span><div class="grid grid-cols-12 gap-0.5 md:gap-1 flex-1 max-w-[520px]">${btns}</div></div>`;
  }).join("");
  return `<div class="grid gap-1 mb-4">${rows}</div>`;
}

// 2026-11-24 利用者の希望: その日の成績はシンプルに（全レース／推奨度S・A／推奨度S・A＋オープン以上）
function daySum(d, date) {
  const line = (label, rs) => {
    const done = rs.filter(r => r.result && r.result.v);
    if (!rs.length) return "";
    const cost = done.reduce((a, r) => a + r.result.v.cost + ((r.result.v_alt || {}).cost || 0), 0);
    const ret = done.reduce((a, r) => a + r.result.v.ret + ((r.result.v_alt || {}).ret || 0), 0);
    const hits = done.filter(r => hitRet(r.result.v) + hitRet(r.result.v_alt) > 0).length;
    const wait = rs.length - done.length;
    if (!done.length) return `<div>${label}：${rs.length}レース（結果待ち）</div>`;
    const roi = cost ? Math.round(ret / cost * 100) : 0;
    return `<div>${label}：${done.length}レース、的中${hits}レース、投資${yen(cost)}円、払い戻し${yen(ret)}円、<span class="${roi >= 100 ? "text-red-600 font-bold" : "text-gray-600"}">回収率${roi}%</span>${wait ? `<span class="text-gray-400">（ほか結果待ち${wait}レース）</span>` : ""}</div>`;
  };
  const all = d.races.filter(r => r.bet_v && vTierOf(r));
  const sa = all.filter(r => ["新S", "新A"].includes(vTierOf(r)));
  const buy = all.filter(r => ["新S", "新A"].includes(vTierOf(r)) || r.op);   // r.op = オープン以上（share_export の出馬表）
  return line(date === todayStr() ? "本日の回収値" : "この日の回収値", all) + line("推奨（S・A）", sa) + line("推奨＋オープン以上", buy);
}

let DAY_VEN = {};   // 開催日ごとに選んだ競馬場（スマホ）
async function dayPage(date) {
  const d = await get(date);
  const ds = (await get("days")).map(x => x.date).sort();
  const places = [...new Set(d.races.map(r => r.place))];
  const head = pl => { const r0 = d.races.find(r => r.place === pl && r.kai); return r0 ? `${r0.kai}回${pl}${r0.nichi}日目` : pl; };
  setBar(jpDate(date).replace(/^\d+年/, ""), places.map(head).join("・"), "#days");
  // 2026-11-24 見本の形: 日付のボタン → 成績 → 競馬場の切り替え（PCは横に並べる）→ 推奨だけの切り替え → 1Rから縦のカード
  const i = ds.indexOf(date), near = ds.slice(Math.max(0, i - 3), i + 3);
  const chips = `<div class="xchips">${near.map(x => `<a href="#d-${x}" class="xchip${x === date ? " on" : ""}">${shortDate(x)}</a>`).join("")}<a href="#days" class="xchip">一覧</a></div>`;
  const only = LS.get("onlyRec", false);
  if (!DAY_VEN[date] || !places.includes(DAY_VEN[date])) {
    const nx = d.races.filter(r => !r.result && r.bet_v && ["新S", "新A"].includes(r.bet_v.tier)).sort((a, b) => (a.start || "").localeCompare(b.start || ""))[0];
    DAY_VEN[date] = nx ? nx.place : places[0];
  }
  const seg = places.length > 1 ? `<div class="xseg xvseg">${places.map(p => `<a href="#d-${date}" data-ven="${e(p)}" class="${p === DAY_VEN[date] ? "on" : ""}">${e(p)}</a>`).join("")}</div>` : "";
  const tog = `<div class="xtog"><span>推奨・オープン以上だけ</span><button type="button" class="xsw${only ? " on" : ""}" data-onlyrec aria-label="推奨・オープン以上だけ"></button></div>`;
  const vens = places.map(pl => {
    const rs = d.races.filter(r => r.place === pl && (!only || ["S", "A"].includes(tierLetter(r)) || r.op)).sort((a, b) => a.race - b.race);
    return `<div class="xven${pl === DAY_VEN[date] ? " on" : ""}"><div class="xvh">${e(head(pl))}</div>${goingLine(d, pl)}` +
      (rs.map(r => raceCard(date, r)).join("") || `<div class="xcard text-gray-500 text-[13px]">当てはまるレースはありません。</div>`) + `</div>`;
  }).join("");
  document.title = `${jpDate(date)} レース一覧`;
  return `<div class="xfade">${chips}<div class="xcard text-[12px] leading-relaxed">${daySum(d, date) || "推奨はまだありません。"}</div>${seg}${tog}<div class="xvens">${vens}</div></div>`;
}

// ---------------------------------------------------------------- 出馬表・結果（タブ）と並び替え
const MARK_ORD = {"◎": 0, "○": 1, "▲": 2, "△": 3, "☆": 4, "": 5, "消": 6};
const GRADE_ORD = {"S": 0, "A": 1, "B+": 2, "B-": 3, "C": 4, "消": 5};
const DAY_ORD = {"合う": 0, "普通": 1, "合わない": 2};
const MEDAL = {1: "bg-yellow-300", 2: "bg-gray-300", 3: "bg-orange-300"};
const TD = 'class="border border-gray-300';
const num = x => { const v = parseFloat(x); return isNaN(v) ? null : v; };
const secs = t => { if (!t) return null; const [a, b] = String(t).includes(":") ? String(t).split(":") : [0, t]; return +a * 60 + +b; };
const lastPos = p => p ? +String(p).split("-").pop() : null;
const pct = x => x != null ? (x * 100).toFixed(0) + "%" : "-";
const markHtml = mk => mk ? `<span class="m-${mk}">${mk}</span>` : '<span class="text-gray-300">-</span>';
const finHtml = h => `<td ${TD} font-bold ${MEDAL[h.fin] || ""}">${h.fin || (h.scratch ? "取消" : "中止")}</td>`;
const wakuHtml = h => { const w = String(h.waku ?? "").trim(); return `<td ${TD} waku-${e(w)} font-bold">${e(w)}</td>`; };

// 列の定義: [キー, 見出し, 見出しの色, 並び替えの値, セルのHTML]

    ["note", "短評", "min-w-[300px]", h => (h.np || "") + (h.nn || ""), h => `<td ${TD} text-left px-2 py-1" style="white-space:normal">${noteHtml(h, false)}</td>`],

    ["prob", "適合度", "bg-gray-700 text-yellow-100", h => h.prob != null ? -h.prob : null, h => `<td ${TD} bg-yellow-50">${pct(h.prob)}</td>`],
    ["value", "期待値", "bg-gray-700 text-blue-100", h => h.value != null ? -h.value : null, h => {
      const v = h.value;
      return `<td ${TD} bg-blue-50">${v && v >= 1 && ["S", "A", "B+"].includes(h.grade) ? `<span class="font-bold text-blue-600">${pct(v)}</span>` : v ? `<span class="text-gray-500">${pct(v)}</span>` : "-"}</td>`; }],
    ["mratio", "見落とし度", "bg-gray-700 text-amber-100", h => h.mratio != null ? -h.mratio : null, h => {
      const v = h.mratio;
      return `<td ${TD} bg-amber-50">${v == null ? "-" : v >= 1.1 ? `<span class="font-bold text-amber-700">${v.toFixed(2)}</span>` : `<span class="text-gray-600">${v.toFixed(2)}</span>`}</td>`; }],

      const p = h.pts;
      return `<td ${TD} bg-orange-50">${p != null && p >= 75 ? `<span class="font-bold text-red-600 text-[15px]">${p}</span>` : p != null ? `<span class="font-bold text-gray-700">${p}</span>` : "-"}</td>`; }],
    ["zi", "ZI", "text-green-300", h => h.zi != null ? -h.zi : null, h => `<td ${TD} text-green-700">${h.zi != null ? Math.round(h.zi) : "-"}</td>`],

  return cols;
}

const runGradeHtml = (r, h) => { const g = runGrade(r, h); return g ? `<span class="grc gr-${g.replace("+", "p").replace("-", "m")}">${e(g)}</span>` : ""; };

let SORT = {view: "", key: "", dir: 1};

function sortTable(cols, horses, view, defKey, minW) {
  if (SORT.view !== view) SORT = {view, key: defKey, dir: 1};
  const col = cols.find(c => c[0] === SORT.key) || cols.find(c => c[0] === defKey);
  const rows = [...horses].sort((a, b) => {
    const x = col[3](a), y = col[3](b);
    if (x == null && y == null) return a.num - b.num;
    if (x == null) return 1;
    if (y == null) return -1;
    const c = typeof x === "string" ? x.localeCompare(y, "ja") : x - y;
    return c * SORT.dir || a.num - b.num;
  });
  const th = cols.map(c => {
    const on = c[0] === col[0];
    return `<th data-sort="${c[0]}" class="border border-gray-400 py-2 px-1 ${c[2]}${on ? " sort-on" : ""}">${c[1]}<span class="sort-ind">${on ? (SORT.dir > 0 ? "▲" : "▼") : "⇅"}</span></th>`;
  }).join("");
  return `<div class="overflow-x-auto"><table class="w-full ${minW} border-collapse border border-gray-300 text-center mb-4">` +
    `<thead class="table-header text-xs whitespace-nowrap"><tr>${th}</tr></thead><tbody class="text-sm">` +
    rows.map(h => `<tr class="hover:bg-gray-50${view.endsWith("card") && h.mark === "◎" ? " row-axis" : ""}">${cols.map(c => c[4](h)).join("")}</tr>`).join("") +
    `</tbody></table></div>`;
}

function payTable(pays) {
  const rows = Object.entries(pays || {}).map(([k, items]) =>
    `<tr><th class="border border-gray-300 bg-gray-100 px-3 py-1 whitespace-nowrap text-left">${k}</th><td class="border border-gray-300 px-3 py-1 text-left">` +
    items.map(t => `<span class="inline-block mr-4 whitespace-nowrap"><b>${t.nums.join(k === "馬単" || k === "3連単" ? "→" : "-")}</b> ${yen(t.pay)}円<span class="text-[11px] text-gray-500">（${t.pop ?? "-"}人気）</span></span>`).join("") +
    `</td></tr>`).join("");
  return rows ? `<table class="w-full border-collapse border border-gray-300 text-sm mb-4">${rows}</table>` : '<p class="text-gray-500 mb-4">払戻のデータがありません。</p>';
}

// どういうレースだったかとレース評価（2026-11-21 利用者の希望。app/race_eval_export.py → share_export が r.ev に入れる）
function evSection(r) {
  const v = r.ev;
  if (!v) return r.result ? `<h2 class="font-bold mb-2">このレースの内容と評価</h2><div class="stc mb-4 text-[12px] text-gray-500">レースの内容とレース評価は、成績データを取り込んだあとに出ます。</div>` : "";
  const rk = v.rk ? `<span class="gr gr-${v.rk.replace("+", "p").replace("-", "m")} evrk">${e(v.rk)}</span>` : "";
  return `<h2 class="font-bold mb-2">このレースの内容と評価</h2><div class="stc mb-4">` +
    (rk ? `<div class="flex items-center gap-2 mb-1.5"><span class="text-[11px] text-gray-500">レース評価</span>${rk}<span class="font-bold text-[13px]">${e(v.vd || "")}</span></div>` : "") +
    `<div class="text-[13px] leading-relaxed">${e(v.flow || "")}${e(v.fin || "")}</div>` +
    (v.lv && v.lv.length ? `<ul class="text-[12px] text-gray-600 mt-1.5 leading-relaxed list-disc pl-4">${v.lv.map(x => `<li>${e(x)}</li>`).join("")}</ul>` : "") +
    `<div class="text-[10px] text-gray-400 mt-1.5">レース評価はそのクラスとしてのレースのレベル（S ハイレベル・A 高め・B+ 標準・B- 低め・C 低レベル）。その日の馬場差を除いた勝ちタイムと、出走馬の近走の力から付けています。</div></div>`;
}

// 2026-11-22 利用者の希望: 着順 → レース内容と評価 → レースの流れ → 推奨買い目（extra＝買い目の結果の箱）→ 払戻 の順
function resultTab(r, extra = "") {
  const res = r.result || {}, rc = res.race || {};
  const box = (t, v, sub = "") => `<div class="bg-gray-50 border border-gray-200 rounded p-2 min-w-[110px]"><div class="text-[11px] text-gray-500">${t}</div><div class="font-bold">${v}</div>${sub ? `<div class="text-[11px] text-gray-500">${sub}</div>` : ""}</div>`;
  const hitPred = r.shape && rc.pace && rc.type;
  const laps = (rc.laps || []).map(x => `<span class="inline-block px-1.5 py-0.5 m-0.5 bg-gray-100 border border-gray-200 rounded text-[12px]">${x.toFixed(1)}</span>`).join("");
  let bet = "";
  if (r.bet && "bet_return" in res) {
    const hit = res.bet_return > 0;
    const T = TIER[tierOf(r)], band = {B: "20〜50倍", B2: "10〜20倍"}[tierOf(r)] || "10〜25倍";
    bet = `<div class="${hit ? "bg-yellow-100 border-yellow-400" : "bg-gray-100 border-gray-200"} p-2 rounded border mb-4"><span class="text-xs text-gray-500 block">${T.name}・AI推奨買い目（${T.kind}）の結果</span>` +
      `<span class="font-bold ${hit ? "text-red-600" : "text-gray-500"}">${hit ? `的中 ${yen(res.bet_return)}円` : "不的中"}（投資 ${yen(res.bet_cost)}円）</span>` +
      `${res.axis_final_in_band ? "" : `<span class="block text-[11px] text-gray-500">◎の確定単勝が${band}の外（実際には見送りの条件）</span>`}</div>`;
  }
  const best = Math.min(...r.horses.map(h => h.l3f || 99));
  const mrows = [...r.horses].sort((a, b) => (a.fin || 99) - (b.fin || 99)).map(h => horseRow(r, h, true, best)).join("");
  return arareNote(r) + `<h2 class="font-bold mb-2">着順</h2><div class="xcard xhzl md:hidden" style="padding:2px 10px">${mrows}</div><div class="dtable">` + sortTable(resCols(r), r.horses, raceKey + "res", "fin", "min-w-[900px]") + `</div>` +
    `<div class="text-[10px] text-gray-400 -mt-2 mb-4 leading-relaxed">${Object.keys((r.ev || {}).g || {}).length ? "右の S〜C（PCは「今回の評価」の列）は、このレースでの各馬の走りの評価。過去走の右上と同じもの（S 最高評価・A 高評価・B+ 標準・B- 評価を下げる・C 最低評価。着差・展開の有利不利・上がりに、レースレベルを含めたそのクラスでの絶対評価）。" : "各馬の走りの評価（過去走の右上と同じ S〜C）は、成績データを取り込んだあとに出ます。"}</div>` + evSection(r) +
    `<h2 class="font-bold mb-2">レースの流れ</h2><div class="flex flex-wrap gap-2 mb-2">` +
    box("実際の展開", e(rc.shape || (r.surface === "障害" ? "障害のため対象外" : "-")), hitPred ? `AI予想: ${e(r.shape)}` : "") +
    box("前半3F", rc.f3 != null ? rc.f3.toFixed(1) : "-") + box("後半3F", rc.l3 != null ? rc.l3.toFixed(1) : "-") +
    box("前後3F差", rc.diff != null ? (rc.diff > 0 ? "+" : "") + rc.diff : "-", "＋＝前半が速い") + box("レースPCI", rc.pci ?? "-", "50超＝後半が速い") + `</div>` +
    (laps ? `<div class="mb-2"><span class="text-[11px] text-gray-500 mr-1">ラップ（1Fごと）</span>${laps}</div>` : "") +
    ((rc.corners || []).length ? `<div class="text-[12px] text-gray-600 mb-4 leading-relaxed">${rc.corners.map(e).join("<br>")}</div>` : "") +
    ((bet || r.bets_a || r.bet_v || extra) ? `<h2 class="font-bold mb-2">推奨買い目</h2>` : "") + bet + (r.bets_a ? aSection(r, true) : "") + (r.bet_v ? vSection(r, true) : "") + extra +
    `<h2 class="font-bold mb-2 mt-4">払戻（100円あたり）</h2>` + payTable(rc.pays);
}

// 推奨度Aの買い目。同じ馬券が複数の案に出るときは金額を合算して1行にまとめる（案の名前は出さない）
function aTickets(r) {
  const m = new Map();
  for (const b of r.bets_a || []) for (const t of b.tickets) {
    const k = t.type + ":" + t.nums.join("-");
    if (!m.has(k)) m.set(k, {type: t.type, nums: t.nums, yen: 0});
    m.get(k).yen += t.yen;
  }
  return [...m.values()];
}
function aSection(r, withResult) {
  const tks = aTickets(r), types = ["3連複", "馬連", "ワイド"].filter(t => tks.some(x => x.type === t));
  const axes = [...new Set(r.bets_a.map(b => b.axis))];
  const fmt = typ => tks.filter(t => t.type === typ).map(t => `${t.nums.join("-")}（${yen(t.yen)}円）`).join("　");
  let res = "";
  const xs = Object.values((r.result || {}).a || {});
  if (withResult && xs.length) {
    const ret = xs.reduce((a, x) => a + x.ret, 0), cost = xs.reduce((a, x) => a + x.cost, 0);
    res = `<div class="text-[13px] mt-2 font-bold ${ret ? "text-red-600" : "text-gray-500"}">${ret ? `的中 ${yen(ret)}円` : "不的中"}（投資 ${yen(cost)}円）</div>`;
  }
  return `<div class="bg-white border border-violet-200 rounded p-3 mb-4"><div class="font-bold mb-1"><span class="badge-tiera mr-1">推奨度A</span>推奨買い目</div>` +
    `<div class="text-[12px]">◎ ${axes.join("・")}　相手 ${[...new Set(r.bets_a.flatMap(b => b.partners.concat(b.stars)))].filter(n => !axes.includes(n)).join("・")}</div>` +
    types.map(t => `<div class="text-[12px] mt-1">${t} ${fmt(t)}</div>`).join("") +
    `<div class="text-[12px] mt-1 text-gray-600">${tks.length}点・計${yen(tks.reduce((a, t) => a + t.yen, 0))}円</div>` + res +
    `<div class="text-[11px] text-gray-500 mt-2">${A_NOTE}</div></div>`;
}

// 推奨度 S・A・B・C（bet_v）の買い目
function vSection(r, withResult) {
  const b = r.bet_v, t = b.tier, T = VT[t];
  let res = "";
  const x = (r.result || {}).v;
  if (withResult && x) res = `<div class="text-[13px] mt-2 font-bold ${hitRet(x) ? "text-red-600" : "text-gray-500"}">${hitRet(x) ? `的中 ${yen(hitRet(x))}円` : "不的中"}（投資 ${yen(x.cost)}円）${x.refund ? `<span class="font-normal text-gray-600">　返還 ${yen(x.refund)}円</span>` : ""}` +
    `${x.in_band || ["新C", "新D"].includes(t) ? "" : '<span class="block text-[11px] font-normal text-gray-500">◎の確定単勝が条件の範囲の外（実際には見送りの条件）</span>'}</div>`;
  const pts = tks => tks.map(k => k.nums.join("-")).join("　");
  const trio = (b.kind || "3連複") === "3連複" && !b.trio3, both = !!b.tickets_alt;
  const sum = tks => `${tks.length}点・計${yen(tks.reduce((a, k) => a + k.yen, 0))}円`;
  const xa = (r.result || {}).v_alt;
  const resAlt = withResult && xa ? `<div class="text-[13px] mt-1 font-bold ${xa.ret ? "text-red-600" : "text-gray-500"}">3連複 ${xa.ret ? `的中 ${yen(xa.ret)}円` : "不的中"}（投資 ${yen(xa.cost)}円）</div>` : "";
  if (b.form) {   // 新馬戦（3連複と馬連を合わせて買う形など）
    const types = [...new Set(b.tickets.map(k => k.type))];
    return `<div class="bg-white border ${T.box.split(" ")[1]} rounded p-3 mb-4"><div class="font-bold mb-1"><span class="${T.badge} mr-1">推奨度${vn(t)}</span>新馬戦の推奨買い目</div>` +
      `<div class="text-[12px] text-gray-600 mb-1">${e(b.form)}</div>` +
      `<div class="text-[12px]">◎ ${b.axis}　○▲△ ${b.partners.join("・")}　☆ ${(b.stars || []).join("・") || "なし"}${b.tier === "新C" ? "（☆は印のみ）" : ""}</div>` +
      types.map(ty => { const tk = b.tickets.filter(k => k.type === ty); return `<div class="text-[11px] text-gray-600 mt-1">${ty} ${pts(tk)}（各${yen(tk[0].yen)}円・${sum(tk)}）</div>`; }).join("") +

let raceKey = "", curPastKey = "", pastSrc = "";

// 馬名を押すと過去走を開く（app/past_export.py が書く data/past/<日付>.json を、押したときだけ読む）。もう一度押すと閉じる
async function togglePast(num, el) {

  const nxt = tr.nextElementSibling;
  if (nxt && nxt.classList.contains("pastrow")) { nxt.remove(); return; }
  const date = pastSrc || raceKey.split("-")[0];
  const isTr = tr.tagName === "TR";
  const row = document.createElement(isTr ? "tr" : "div");
  row.className = "pastrow";
  row.innerHTML = isTr ? `<td colspan="${cols}"><div class="pastbox"><div class="text-[11px] text-gray-500">読み込み中…</div></div></td>` : `<div class="pastbox"><div class="text-[11px] text-gray-500">読み込み中…</div></div>`;
  tr.after(row);
  try {
    if (!pastCache[date]) pastCache[date] = await fetch(pastSrc || `data/past/${date}.json`, {cache: "no-cache"}).then(x => x.ok ? x.json() : {});
  } catch (err) { pastCache[date] = {}; }
  const runs = pastSrc ? (pastCache[date] || {})[String(num)] : ((pastCache[date] || {})[curPastKey] || {})[String(num)];
  const pn0 = tr.querySelector(".pn"), pn = pn0 ? (pn0.querySelector("b") || pn0) : null, nm = pn ? [...pn.childNodes].filter(n => n.nodeType === 3).map(n => n.textContent).join("").trim() : "";
  const wbtn = nm ? `<button type="button" data-watch="${e(nm)}" class="mb-1 px-2 py-1 border border-amber-300 bg-amber-50 rounded text-[12px] font-bold text-amber-700">${isWatched(nm) ? "★ 注目馬（押すと解除）" : "☆ 注目馬に登録"}</button>` : "";
  const [kd, kp, kr] = raceKey.split("-");
  const hh = /^[0-9]{8}$/.test(kd) ? ((((await get(kd)).races || []).find(x => (PLACE[x.place] || "00") === kp && x.race === +kr) || {horses: []}).horses || []).find(x => x.num === num) : null;
  const full = hh && (hh.np || hh.nn) ? `<div class="prun"><b style="color:#9a7b2f">短評</b>${noteHtml(hh, false)}</div>` : "";
  row.querySelector(".pastbox").innerHTML = wbtn + (runs && runs.length ? `<div class="text-[10px] text-gray-500">評価（右上）: S 最高評価・A 高評価・B+ 標準・B- 評価を下げる・C 最低評価。そのクラスでの絶対評価で、レースの中での走り（着差・展開の有利不利・上がり）に、レースレベル（その日の馬場差を除いた勝ちタイム・出走馬の近走の力）を含めています。同じ着順でも、高レベル戦なら上がり、低レベル戦なら下がります。</div>` + runs.map(pastRun).join("") :
    `<div class="text-[11px] text-gray-500">${pastCache[date] && Object.keys(pastCache[date]).length ? "過去走はありません（初出走）。" : "この日の過去走はまだありません（新しい開催日20日分だけ置いています）。"}</div>`);
}
function pastRun(x) {
  const [kai, place, course, going, cls, name, heads, waku, num, jockey, kg, pop, odds, fin, margin, time, hosei, passing, l3, l3r, pci, weight, gap, ai, comment, grade] = x;
  const top = /^[123]$/.test(fin);
  const aiColor = /不利で好走/.test(ai) ? "background:#e3f4ea;color:#1f7a45" : /有利で凡走|利で凡走/.test(ai) ? "background:#fde8e8;color:#b42318" :
    /好走/.test(ai) ? "background:#eef2fb;color:#2f4f8f" : "background:#f1f1f1;color:#555";
  const gcl = g => g.replace("+", "p").replace("-", "m");
  const gr = grade ? `<span class="gr gr-${gcl(grade)}">${e(grade)}</span>` : "";
  return `<div class="prun"><div>${gr}<b>${e(kai)}</b> ${e(name)}${cls && !name.normalize("NFKC").includes(cls.normalize("NFKC")) ? `（${e(cls)}）` : ""} ${e(course)} ${e(going)} ${e(heads)}頭</div>` +
    `<div><span class="fin${top ? " top" : ""}">${e(fin || "-")}着</span>${margin ? `${e(margin)}差　` : ""}${e(time)}${hosei ? `　補正${e(hosei)}` : ""}</div>` +
    `<div>${waku ? `${e(waku)}枠` : ""}${e(num)}番　${e(jockey)} ${e(kg)}　${e(pop)}人気 ${e(odds)}倍${weight ? `　${e(weight)}` : ""}${gap ? `　間隔${e(gap)}週` : ""}</div>` +
    `<div>${passing ? `通過 ${e(passing)}　` : ""}${l3 ? `上り${e(l3)}${l3r ? `（${e(l3r)}位）` : ""}` : ""}${pci ? `　PCI ${e(pci)}` : ""}</div>` +
    (ai ? `<div style="margin-top:3px"><span class="tg" style="${aiColor}">AI ${e(ai)}</span></div>` : "") +
    (comment ? `<div class="cm"><b style="color:#9a7b2f">AIのコメント</b>　${e(comment)}</div>` : "") + `</div>`;
}

function raceLegend(r) {
  return `見出しを押すと並び替え（もう一度押すと逆順）。AI印：◎＝軸（推奨度S：オープン以上・芝で単勝10〜25倍×能力S/A（同じ条件のダートは推奨度A）、推奨度B：3勝クラスで単勝20〜50倍×能力S/A、推奨度A：3勝芝で単勝20〜30倍・ランクB+以上・能力÷市場1.2以上。見落とし度の推奨度（S：1勝・3勝芝・オープン以上芝の馬連、A：3勝ダートの3連複・オープン以上ダートの馬連、C：未勝利・2勝の馬連）：単勝10〜20倍で見落とし度1.1以上。上の推奨度と重なったら1つだけ出す（芝は上の推奨度、ダートは見落とし度）。ほかの推奨度が付かないレースは推奨度D（単勝6.9倍以下×能力S・A×見落とし度1.0以上から◎、ワイド ◎−○▲△ 各500円で1,500円）。オッズが出る前は付かない。新馬戦は別の決め方：推奨度Bは◎10〜20倍で特徴3つ以上、推奨度Cはそれ以外のレースで特徴の多い馬が◎、3連複 ◎−○▲△）／○▲△＝能力上位3頭（見落とし度の推奨度は見落とし度1.0以上から能力順）／☆＝能力4〜7位（推奨度Sの3連複）、見落とし度0.9〜1.0を人気順（ほかの3連複15点）。買い目に入らないレースの☆は印だけで、残りから能力順に4頭／消＝能力20点未満。` +
    `見落とし度＝オッズ以外の材料も入れた3着内確率 ÷ 単勝オッズだけの3着内確率（オッズが入ってから出る）。` +
    `2026-11-28 から◎のAI評価で推奨度を分けない（3勝・オープン以上芝は条件に当たれば推奨度A）。未勝利・芝は◎（単勝10〜20倍・見落とし度1.1以上の能力1位）の単勝で推奨度A、オープン以上・ダートは◎（単勝10〜15倍・見落とし度1.0以上の能力1位）の単勝で推奨度S（当たらなければ前の買い目のまま推奨外）。未勝利・ダートの推奨度A（能力3位以内・単勝8〜20倍・見落とし度1.15以上の◎、馬連3点）は、◎のAI評価の点が110以上なら推奨度S、それ未満は推奨度A。1勝・ダートは推奨度S（能力5位以内・単勝12〜40倍・見落とし度1.2以上の◎、馬連3点）、推奨度A（能力5位以内・単勝12〜20倍・見落とし度1.1以上の◎、ワイド3点）で、AI評価で分け直さない。1勝・芝は推奨度S（能力5位以内・単勝8〜50倍・見落とし度1.2以上の◎、相手は人気上位3頭、馬連3点）、推奨度A（能力5位以内・単勝10〜30倍・見落とし度1.1以上・30分前から売れてきた◎、ワイド3点）で、これも分け直さない。2勝・芝は推奨度S（ワイド3点）と、推奨度Bのうち◎が能力7〜10位・見落とし度0.9〜1.0のものを推奨度Aにしたもので、これも分け直さない。2勝・ダートも推奨度S（ワイド3点）と、推奨度Bのうち◎が能力4〜6位・AI評価75点未満のものを推奨度Aにしたもの。能力＝新適合度のランク（S・A・B+・B-・C。20点未満の「消」も C で表示）。AI評価＝能力の点に見落とし度を足した総合の5段階（印を決める材料と同じ。オッズが出る前は能力だけ）。近走評価＝近3走の評価（過去走の右上の S〜C。新しい走りほど重く、今回とのクラスの差で上げ下げ）をまとめた5段階（スマホは馬名の下。過去走が無い馬は出ない）。展開＝当日の前のレースの傾向への合い方。適合度＝オッズ抜きの3着内確率。` +

const LS = {get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (_) { return d; } }, set: (k, v) => localStorage.setItem(k, JSON.stringify(v))};

// 取消・除外（5）: 発売中のオッズで単勝が付かなくなった馬（r.scratched）と、結果で取消・除外だった馬（h.scratch）
function scratchInfo(r) {
  const gone = [...new Set([...(r.scratched || []), ...(r.horses || []).filter(h => h.scratch).map(h => h.num)])];
  if (!gone.length || !r.bet_v) return null;
  const tks = r.bet_v.tickets.concat(r.bet_v.tickets_alt || []);
  const hit = tks.filter(t => t.nums.some(n => gone.includes(n)));
  return hit.length ? {gone: gone.filter(n => tks.some(t => t.nums.includes(n))), n: hit.length, yen: hit.reduce((a, t) => a + t.yen, 0)} : null;
}
function scratchBox(r) {
  const s = scratchInfo(r);
  if (!s) return "";
  const by = Object.fromEntries((r.horses || []).map(h => [h.num, h]));
  const ax = s.gone.includes(r.bet_v.axis);
  return `<div class="bg-red-50 border border-red-300 rounded p-2 mb-3 text-[13px]"><div class="font-bold text-red-700">出走取消・除外</div>` +
    s.gone.map(n => `<div>${e((by[n] || {}).mark || "")}${n} ${e((by[n] || {}).name || "")}</div>`).join("") +
    `<div class="text-[12px] mt-1">この馬を含む買い目 ${s.n}点・${yen(s.yen)}円は返還されます。${ax ? "◎が取消のため、見送りも検討してください。" : ""}</div></div>`;

// 最終更新と停止の警告（4）: PC が載せる data/status.json。開催日の発走40分前〜最終レース30分後に20分以上更新が無ければ警告
const STALE_MIN = 20;
async function statusBar() {
  const el = document.getElementById("stbar");
  if (!el) return;
  let st;
  try { st = await fetch("data/status.json", {cache: "no-store"}).then(x => x.ok ? x.json() : null); } catch (_) { st = null; }
  if (!st || !st.at) { el.innerHTML = ""; return; }
  const at = new Date(st.at.replace(" ", "T")), now = new Date(), mins = Math.round((now - at) / 60000);
  let warn = false;
  try {
    const days = await get("days"), t = todayStr();
    if (days.some(x => x.date === t)) {
      const d = await get(t);
      const ts = d.races.map(r => r.start).filter(Boolean).sort();
      if (ts.length) {
        const tm = s => { const [h, m] = s.split(":").map(Number); const x = new Date(); x.setHours(h, m, 0, 0); return x; };
        warn = now >= new Date(tm(ts[0]) - 40 * 60000) && now <= new Date(+tm(ts[ts.length - 1]) + 30 * 60000) && mins >= STALE_MIN;
      }
    }
  } catch (_) {}
  const hm = `${at.getMonth() + 1}/${at.getDate()} ${String(at.getHours()).padStart(2, "0")}:${String(at.getMinutes()).padStart(2, "0")}`;
  el.innerHTML = warn
    ? `<div class="bg-red-600 text-white text-[13px] font-bold px-3 py-2 rounded mb-3">PCからの更新が${mins}分止まっています（最終更新 ${hm}）。オッズ・推奨・結果が古い可能性があります。PCとTARGETを確認してください。</div>`
    : `<div class="text-[11px] text-gray-400 mb-2 text-right">最終更新 ${hm}</div>`;
}

async function pushRegister() {

  const ios = /iPhone|iPad/.test(navigator.userAgent), standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;

      if (txt == null || txt === RAW[k]) continue;
      changed = changed || RAW[k] !== undefined;
      RAW[k] = txt; cache[k] = Promise.resolve(JSON.parse(txt));
    }
    if ((changed || always) && location.hash.slice(1) === h) await route(true);
  } finally { AUTO_BUSY = false; }
}

function fitText(root = document) {

}

async function route(keepScroll) {
  const h = location.hash.slice(1), my = ++ROUTE_SEQ;
  BAR_SET = false;
  let m, out, dl = null;
  let isHome = false;
  try {
    if (h === "latest") { dl = currentDate((await get("days")).map(x => x.date)); out = await dayPage(dl); }
    else if (h === "about") { out = await aboutPage(); }
    else if (h === "tiers") { out = await tiersPage(); }
    else if (h === "stats") { out = await statsPage(); }
    else if (h === "days") { out = await daysPage(); }
    else if ((m = h.match(/^h-(\d{8})-(\d{2})-(\d{1,2})(-res)?$/))) { out = await histRacePage(m[1], m[2], +m[3], m[4] ? "res" : "card"); }
    else if ((m = h.match(/^d-(\d{8})$/))) { out = await dayPage(m[1]); dl = m[1]; }
    else if ((m = h.match(/^r-(\d{8})-(\d{2})-(\d{1,2})(-res|-ai)?$/))) { out = await racePage(m[1], m[2], +m[3], m[4] ? m[4].slice(1) : "card"); dl = m[1]; }
    else { out = await home(); isHome = true; }
  } catch (err) {
    out = `<p class="text-gray-500">データを読み込めませんでした（${e(err.message)}）。<a href="#top" class="text-blue-600 underline">ホームへ</a></p>`;
  }
  if (my !== ROUTE_SEQ) { if (BAR_SNAP) BAR_SNAP(); return; }   // 後から別の画面へ移った: 書かない（見出しも新しい画面のものに戻す）
  app.innerHTML = out;
  if (dl) lastDate = dl;
  fitText(app);
  if (!BAR_SET) setBar(document.title === "AI競馬予想" ? "AI競馬予想" : document.title, "", h.startsWith("h-") ? "#stats" : h === "days" ? "#latest" : "");
  const tabOf = ["stats", "about", "tiers"].includes(h) || h.startsWith("h-") ? (h.startsWith("h-") ? "stats" : h) : isHome ? "home" : "day";
  document.querySelectorAll(".bnav a").forEach(a => a.classList.toggle("on", a.dataset.tab === tabOf));
  const seen = h === "days" && lastDate && document.getElementById(`day-${lastDate}`);
  const backH = h === "stats" && !keepScroll && lastHist && document.getElementById(`hr-${lastHist}`);   // 過去の重賞から戻ったら、その行まで
  if (backH) { backH.scrollIntoView({block: "center"}); lastHist = ""; }
  else if (seen) seen.scrollIntoView({block: "center"});
  else if (!keepScroll) { window.scrollTo(0, 0); const sc = document.getElementById("scroller"); if (sc && getComputedStyle(sc).position === "fixed") sc.scrollTop = 0; }
  statusBar();
  document.querySelectorAll(".xchips").forEach(c => { const on = c.querySelector(".on"); if (on) c.scrollLeft = on.offsetLeft - (c.clientWidth - on.offsetWidth) / 2; });
  BAR_SNAP = snapBar();
}
